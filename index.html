<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Night</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --bg:#0d0d0f; --s1:#141418; --s2:#1c1c22; --s3:#222228;
  --border:#2a2a32; --border2:#3a3a45;
  --accent:#e8d44d; --green:#4de8a8; --red:#e84d6f; --blue:#4d9fe8;
  --text:#f0ede6; --muted:#6b6b7a; --muted2:#4a4a58;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;min-height:100vh}

/* HEADER */
.hdr{padding:1.5rem 2rem 1rem;border-bottom:1px solid var(--border);display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:.75rem}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.2rem,5vw,4rem);letter-spacing:.04em;line-height:1;color:var(--accent)}
.hdr-title span{color:var(--text)}
.hdr-meta{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);text-align:right;line-height:1.7}

/* LOADING / ERROR */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:1rem}
.spinner{width:36px;height:36px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)}
.err{margin:2rem;padding:1.25rem;background:#180a0d;border:1px solid var(--red);border-radius:8px;font-family:'DM Mono',monospace;font-size:12px;color:var(--red);line-height:1.7}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);padding:0 2rem;overflow-x:auto;gap:0}
.tab{background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;padding:.8rem 1.1rem;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap;transition:color .15s}
.tab:hover{color:var(--text)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}

/* PANES */
.pane{display:none;padding:1.5rem 2rem 4rem}
.pane.on{display:block}

/* STAT GRID */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:1.75rem}
.stat{background:var(--s1);padding:1.1rem 1rem}
.stat .lbl{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.4rem}
.stat .val{font-family:'Bebas Neue',sans-serif;font-size:2rem;line-height:1}
.stat .sub{font-size:11px;color:var(--muted);margin-top:.2rem}

/* SECTION LABEL */
.sec{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:.06em;color:var(--muted);border-left:3px solid var(--accent);padding-left:.65rem;margin:1.75rem 0 .9rem}

/* CHART BOX */
.cbox{background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:1.1rem 1.25rem;margin-bottom:1.25rem}
.cbox canvas{max-height:280px}

/* CHART GRID */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin-bottom:1.25rem}
@media(max-width:680px){.cgrid{grid-template-columns:1fr}}

/* LEADERBOARD */
.lb{display:grid;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:1.75rem}
.lb-hdr,.lb-row{display:grid;grid-template-columns:44px 1fr 60px 60px 60px 56px 70px 70px 64px;align-items:center;padding:.75rem 1rem;gap:.5rem;background:var(--s1)}
.lb-hdr{background:var(--s2);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lb-row:hover{background:var(--s2)}
.lbp-hdr,.lbp-row{display:grid;grid-template-columns:44px 1fr 74px 74px 64px;align-items:center;padding:.75rem 1rem;gap:.5rem;background:var(--s1)}
.lbp-hdr{background:var(--s2);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lbp-row:hover{background:var(--s2)}
.lb-rank{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:var(--muted2)}
.lb-rank.gold{color:var(--accent)}
.lb-rank.silver{color:#aaa}
.lb-rank.bronze{color:#cd7f32}
.lb-name-wrap .name{font-family:'Bebas Neue',sans-serif;font-size:1.1rem}
.lb-bar{height:3px;background:var(--border2);border-radius:2px;margin-top:4px;overflow:hidden}
.lb-bar-fill{height:100%;border-radius:2px}
.lb-num{font-family:'DM Mono',monospace;font-size:12px;text-align:right}

/* H2H CARDS */
.h2h-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1rem;margin-bottom:1.5rem}
.h2h-card{background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:1.1rem}
.h2h-opp{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;margin-bottom:.25rem}
.h2h-pct{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;line-height:1;margin-bottom:.4rem}
.h2h-bar{height:5px;background:var(--border2);border-radius:3px;overflow:hidden;margin:.4rem 0}
.h2h-bar-fill{height:100%;border-radius:3px;transition:width .5s ease}
.h2h-nums{display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:10px;color:var(--muted)}

/* CONTROLS */
.ctrls{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:1.1rem}
.ctrls label{font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
select,input[type=text]{background:var(--s2);border:1px solid var(--border);color:var(--text);font-family:'DM Mono',monospace;font-size:12px;padding:.45rem .7rem;border-radius:6px;outline:none;cursor:pointer}
select:focus,input:focus{border-color:var(--accent)}
.pill{background:var(--s2);border:1px solid var(--border);color:var(--muted);font-family:'DM Mono',monospace;font-size:11px;padding:3px 11px;border-radius:20px;cursor:pointer;transition:all .15s;user-select:none}
.pill.on{color:var(--bg);border-color:transparent;font-weight:500}

/* SOURCE TOGGLE BAR */
.src-bar{display:flex;align-items:center;gap:.6rem;padding:.85rem 2rem;border-bottom:1px solid var(--border);background:var(--s1);flex-wrap:wrap}
.src-bar label{font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.irl-tag{font-size:8px;letter-spacing:.07em;color:var(--muted2);text-transform:uppercase;font-weight:400;margin-left:4px;vertical-align:middle}

/* CHANGELOG */
.cl-timeline{position:relative;margin-top:.5rem}
.cl-timeline::before{content:'';position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--border2)}
.cl-item{position:relative;padding-left:2.25rem;margin-bottom:1.1rem}
.cl-dot{position:absolute;left:0;top:7px;width:16px;height:16px;border-radius:50%;background:var(--s2);border:2px solid var(--border2);z-index:1}
.cl-item.latest .cl-dot{background:var(--accent);border-color:var(--accent)}
.cl-card{background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:1rem 1.25rem;cursor:pointer}
.cl-item.latest .cl-card{border-color:var(--accent)}
.cl-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem}
.cl-date{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.05em;color:var(--muted);margin-bottom:.4rem}
.cl-msg{font-family:'DM Sans',sans-serif;font-weight:500;font-size:14px;color:var(--text);line-height:1.45;margin-bottom:.6rem}
.cl-meta{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.cl-sha{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.05em;color:var(--muted);background:var(--s2);border:1px solid var(--border);border-radius:20px;padding:2px 10px}
.cl-chevron{font-family:'DM Mono',monospace;font-size:13px;color:var(--muted);line-height:1;flex-shrink:0;margin-top:2px;transition:transform .25s ease,color .25s ease}
.cl-item.open .cl-chevron{transform:rotate(180deg);color:var(--accent)}

/* expandable detail panel */
.cl-detail{max-height:0;overflow:hidden;transition:max-height .35s ease}
.cl-item.open .cl-detail{max-height:1200px}
.cl-detail-inner{margin-top:1rem;padding:1rem 1.1rem;background:var(--bg);border:1px solid var(--border);border-radius:8px}
.cl-detail-row{margin-bottom:.75rem}
.cl-detail-row:last-child{margin-bottom:0}
.cl-detail-lbl{display:block;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted2);margin-bottom:.3rem}
.cl-detail-val{font-family:'DM Mono',monospace;font-size:11px;color:var(--text)}
.cl-detail-msg{font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text);line-height:1.55;white-space:pre-wrap}
.cl-files{display:flex;flex-direction:column;gap:.3rem}
.cl-file{display:flex;align-items:center;justify-content:space-between;gap:1rem;font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);background:var(--s1);border:1px solid var(--border);border-radius:6px;padding:.4rem .65rem}
.cl-file-name{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-file-stats{flex-shrink:0;white-space:nowrap}

/* TABLE */
.tbl-wrap{overflow-x:auto;background:var(--s1);border:1px solid var(--border);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:.65rem 1rem;text-align:left;border-bottom:1px solid var(--border);background:var(--s2);white-space:nowrap;cursor:pointer}
th:hover{color:var(--accent)}
td{padding:.55rem 1rem;border-bottom:1px solid var(--border);font-family:'DM Mono',monospace;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--s2)}
.bdg{display:inline-block;font-size:10px;padding:2px 6px;border-radius:4px;font-weight:500}
.bdg-w{background:rgba(77,232,168,.12);color:var(--green)}
.bdg-l{background:rgba(232,77,111,.12);color:var(--red)}
.bdg-d{background:rgba(232,212,77,.12);color:var(--accent)}

/* PAGINATION */
.pages{display:flex;gap:5px;justify-content:flex-end;padding:.6rem 1rem;align-items:center;font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);flex-wrap:wrap}
.pg{background:var(--s2);border:1px solid var(--border);color:var(--text);font-family:'DM Mono',monospace;font-size:11px;padding:3px 9px;border-radius:5px;cursor:pointer}
.pg:hover,.pg.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}

/* STREAK */
.streak-badge{display:inline-flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--border);border-radius:20px;padding:3px 12px;font-family:'DM Mono',monospace;font-size:11px}

@media(max-width:600px){
  .hdr,.pane,.tabs{padding-left:1rem;padding-right:1rem}
  .lb-hdr,.lb-row{grid-template-columns:36px 1fr 56px 56px 70px}
  .lb-hdr>*:nth-child(4),.lb-row>*:nth-child(4),
  .lb-hdr>*:nth-child(5),.lb-row>*:nth-child(5),
  .lb-hdr>*:nth-child(7),.lb-row>*:nth-child(7),
  .lb-hdr>*:nth-child(8),.lb-row>*:nth-child(8){display:none}
  .lbp-hdr,.lbp-row{grid-template-columns:36px 1fr 64px 64px 56px}
}

/* PASSWORD GATE */
.gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:1000;padding:1.5rem}
.gate-card{width:100%;max-width:340px;text-align:center}
.gate-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.4rem,8vw,3.4rem);letter-spacing:.04em;color:var(--accent);line-height:1;margin-bottom:.3rem}
.gate-title span{color:var(--text)}
.gate-sub{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:1.75rem;letter-spacing:.04em}
.gate-form{display:flex;flex-direction:column;gap:.7rem}
.gate-input{background:var(--s2);border:1px solid var(--border);color:var(--text);font-family:'DM Mono',monospace;font-size:14px;padding:.85rem 1rem;border-radius:8px;outline:none;text-align:center;letter-spacing:.08em;width:100%}
.gate-input:focus{border-color:var(--accent)}
.gate-input.shake{animation:gate-shake .4s}
.gate-btn{background:var(--accent);border:none;color:var(--bg);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;padding:.85rem 1rem;border-radius:8px;cursor:pointer;transition:filter .15s}
.gate-btn:hover{filter:brightness(1.08)}
.gate-err{font-family:'DM Mono',monospace;font-size:11px;color:var(--red);min-height:1.4em;margin-top:.5rem;opacity:0;transition:opacity .15s}
.gate-err.show{opacity:1}
@keyframes gate-shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-9px)}
  40%{transform:translateX(8px)}
  60%{transform:translateX(-6px)}
  80%{transform:translateX(4px)}
}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-title">Chess <span>Night</span></div>
    <div class="gate-sub">Enter the password to view the dashboard</div>
    <form class="gate-form" id="gate-form" autocomplete="off">
      <input class="gate-input" id="gate-input" type="password" placeholder="Password" autofocus>
      <button class="gate-btn" type="submit">Enter</button>
      <div class="gate-err" id="gate-err">Incorrect password. Try again.</div>
    </form>
  </div>
</div>

<div class="hdr">
  <div>
    <div class="hdr-title">Chess <span>Night</span></div>
  </div>
  <div class="hdr-meta" id="meta">Loading...</div>
</div>

<div id="app">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Fetching live data from Google Sheets...</p>
  </div>
</div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
const SHEET_ID = '10feTUuKW9BH-pHnp-A19I2UnVjDN3LIGthjlchm1K0A';
const CSV_URL  = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Sheet1`;

const PC = { // player colors
  John:'#e8d44d', Josh:'#4de8a8', Connor:'#e87a4d',
  Algor:'#a04de8', Conrad:'#4d9fe8', Mak:'#e84d9f',
  Mike:'#4de8e8', Russell:'#f0a050'
};
const pc = p => PC[p] || '#888888';

// ─── POINTS ───────────────────────────────────────────────────────────────────
// Winner column is the source of truth. Point Differential is recorded from the
// winner's perspective with sign intact — the loser gets the exact inverse.
// Draws and games with no recorded differential count as 0 for both players.
function gamePoints(g, player) {
  if(g.source!=='IRL') return 0; // points are an IRL-only concept — Chess.com games never contribute
  if(g._draw) return 0;
  if(g._winner===player) return g._diff;
  if(g._loser===player) return -g._diff;
  return 0;
}
const fmtPts = v => (v>0?'+':'')+v;
const ptsColor = v => v>0?'var(--green)':v<0?'var(--red)':'var(--muted)';
function marginTooltip(g) {
  if(g.source!=='IRL') return `${g['Game ID']}: Played on Chess.com — no point differential recorded`;
  if(g._draw) return 'Draw — no points awarded';
  if(!g._diff) return 'No point differential recorded — 0 pts either way';
  const sign = g._diff>=0?'+':'';
  return `${g['Game ID']}: Winner (${g._winner}) recorded ${sign}${g._diff} pts → `+
    `${g._winner} ${g._diff>=0?'gains':'loses'} ${Math.abs(g._diff)}, `+
    `${g._loser} ${g._diff>=0?'loses':'gains'} ${Math.abs(g._diff)}`;
}

// ─── DATA ─────────────────────────────────────────────────────────────────────
let G = [], GIRL = [], PLAYERS = [];
const charts = {};

// global source toggle — filters every non-points view; points views always use GIRL (IRL only)
window._sourceMode = 'all'; // 'irl' | 'online' | 'all'
const sourceFiltered = games => window._sourceMode==='irl' ? games.filter(g=>g.source==='IRL')
                              : window._sourceMode==='online' ? games.filter(g=>g.source==='Online')
                              : games;

// which color a given player played in a game ('White'/'Black')
const playingAs = (g, player) => g['Player 1']===player ? g['Color 1'] : g['Color 2'];
// 'both' | 'White' | 'Black' — used by the Player and Head-to-Head color filters
const colorFiltered = (games, player, mode) => mode==='both' ? games : games.filter(g=>playingAs(g,player)===mode);

const dc = id => { if(charts[id]){charts[id].destroy(); delete charts[id];} };

function parseCSVLine(line) {
  const out=[]; let cur='', inQ=false;
  for(let i=0;i<line.length;i++){
    if(line[i]==='"'){inQ=!inQ;}
    else if(line[i]===',' && !inQ){out.push(cur);cur='';}
    else cur+=line[i];
  }
  out.push(cur); return out;
}

function parseData(text) {
  const lines = text.trim().split('\n');
  const hdr = parseCSVLine(lines[0]).map(h=>h.trim());
  const games = [];
  for(let i=1;i<lines.length;i++){
    const v = parseCSVLine(lines[i]);
    if(v.length<6) continue;
    const r={};
    hdr.forEach((h,idx)=>r[h]=(v[idx]||'').trim());
    if(!r['Player 1']||!r['Player 2']||!r['Date']) continue;
    const d = new Date(r['Date']); if(isNaN(d)) continue;
    r._d = d;
    r._mo = d.toLocaleString('default',{month:'short',year:'2-digit'});
    r._moFull = d.toLocaleString('default',{month:'short',year:'numeric'});
    // notes analysis
    const notes = (r['Notes']||'').toLowerCase();
    const isDraw = notes.includes('draw') || r['Winner']===r['Loser'] || r['Winner']==='' || (r['Winner']===r['Player 1']&&r['Winner']===r['Player 2']);
    r._draw = isDraw;
    // winner/loser — use Winner col; handle game 256 type anomaly
    r._winner = isDraw ? null : (r['Winner']||'').trim();
    r._loser  = isDraw ? null : (r['Loser']||'').trim();
    r._diff   = parseInt(r['Point Differential'])||0;
    r._timed  = notes.includes('timed') || notes.includes('time out');
    r.source  = 'IRL';
    games.push(r);
  }
  games.sort((a,b)=>a._d-b._d);
  return games;
}

function getPlayers(games) {
  const s=new Set();
  games.forEach(g=>{if(g['Player 1'])s.add(g['Player 1']);if(g['Player 2'])s.add(g['Player 2']);});
  return [...s].filter(p=>p&&p.length>1).sort();
}

// ─── CHESS.COM LIVE DATA ──────────────────────────────────────────────────────
const CHESS_USERNAMES = { John:'jstrev', Josh:'jzyoskowitz', Connor:'conniefizz', Mak:'mpensabene', Russell:'ssuRFitz' };
const usernameToName = {};
Object.entries(CHESS_USERNAMES).forEach(([name,u])=>{ usernameToName[u.toLowerCase()] = name; });

// every (year, month) pair from `startDate` through the current month, inclusive
function monthsFrom(startDate) {
  const months=[];
  let y=startDate.getFullYear(), m=startDate.getMonth()+1;
  const now=new Date(), ny=now.getFullYear(), nm=now.getMonth()+1;
  while(y<ny || (y===ny && m<=nm)){
    months.push({y,m});
    m++; if(m>12){m=1;y++;}
  }
  return months;
}

// converts a Chess.com API game object into our unified game shape, or null if
// either side isn't a friend-group username (outside opponents are ignored)
function chessGameToRecord(cg) {
  const wU = (cg.white&&cg.white.username||'').toLowerCase();
  const bU = (cg.black&&cg.black.username||'').toLowerCase();
  const p1 = usernameToName[wU], p2 = usernameToName[bU];
  if(!p1 || !p2 || p1===p2) return null;
  const wRes = cg.white.result, bRes = cg.black.result;
  const isDraw = wRes!=='win' && bRes!=='win';
  const winner = isDraw ? null : (wRes==='win' ? p1 : p2);
  const loser  = isDraw ? null : (wRes==='win' ? p2 : p1);
  const d = new Date(cg.end_time*1000);
  return {
    'Game ID': 'CC-'+(cg.uuid || (cg.url||'').split('/').pop() || cg.end_time),
    'Player 1': p1, 'Player 2': p2,
    'Color 1': 'White', 'Color 2': 'Black',
    'Winner': winner||'', 'Loser': loser||'',
    'Date': d.toISOString().slice(0,10),
    'Notes': '', 'Point Differential': 'Online',
    source: 'Online',
    _d: d,
    _mo: d.toLocaleString('default',{month:'short',year:'2-digit'}),
    _moFull: d.toLocaleString('default',{month:'short',year:'numeric'}),
    _draw: isDraw, _winner: winner, _loser: loser, _diff: 'Online', _timed: false
  };
}

// fetches every friend-group player's archives in parallel, from `startDate`
// forward, dedupes shared games, and keeps only friend-vs-friend matchups.
// Any single request failing is skipped silently — the dashboard never breaks.
async function fetchChessCom(startDate) {
  const months = monthsFrom(startDate);
  const tasks = [];
  Object.values(CHESS_USERNAMES).forEach(username=>{
    months.forEach(({y,m})=>{
      const mm = String(m).padStart(2,'0');
      tasks.push(
        fetch(`https://api.chess.com/pub/player/${username}/games/${y}/${mm}`)
          .then(r => r.ok ? r.json() : {games:[]})
          .then(j => j.games||[])
          .catch(()=>[])
      );
    });
  });
  const results = await Promise.all(tasks);
  const seen = new Set();
  const games = [];
  results.flat().forEach(cg=>{
    const key = cg.uuid || cg.url;
    if(!key || seen.has(key)) return;
    seen.add(key);
    const rec = chessGameToRecord(cg);
    // the API only paginates by month, so the start month can include games
    // from earlier in that month — trim to "earliest sheet date forward" exactly
    if(rec && rec._d >= startDate) games.push(rec);
  });
  games.sort((a,b)=>a._d-b._d);
  return games;
}

// ─── ANALYTICS ────────────────────────────────────────────────────────────────
function pStats(player, games, ptsPool=GIRL) {
  // `games` drives the W/L/D record (respects the source toggle and any color
  // filter); points are an IRL-only concept and come from `ptsPool`, which
  // defaults to GIRL (full IRL set) but callers may pass a narrower IRL subset
  // (e.g. color-filtered) — points always stay within IRL games regardless.
  const pg = games.filter(g=>g['Player 1']===player||g['Player 2']===player);
  let w=0,l=0,d=0;
  pg.forEach(g=>{
    if(g._draw) d++;
    else if(g._winner===player) w++;
    else l++;
  });
  const t=w+l+d;
  const ipg = ptsPool.filter(g=>g['Player 1']===player||g['Player 2']===player);
  let pts=0;
  ipg.forEach(g=>{ pts += gamePoints(g, player); });
  return {w,l,d,t,pct:t?Math.round(w/t*100):0,pts,avgPts:ipg.length?+(pts/ipg.length).toFixed(1):0,pg};
}

function h2h(player, games, ptsPool=GIRL) {
  const opp={};
  games.filter(g=>g['Player 1']===player||g['Player 2']===player).forEach(g=>{
    const o = g['Player 1']===player?g['Player 2']:g['Player 1'];
    if(!opp[o]) opp[o]={w:0,l:0,d:0,pts:0};
    if(g._draw) opp[o].d++;
    else if(g._winner===player) opp[o].w++;
    else opp[o].l++;
  });
  // points tally is IRL-only — pulled from `ptsPool` (defaults to GIRL), ignoring the source toggle
  ptsPool.filter(g=>g['Player 1']===player||g['Player 2']===player).forEach(g=>{
    const o = g['Player 1']===player?g['Player 2']:g['Player 1'];
    if(!opp[o]) opp[o]={w:0,l:0,d:0,pts:0};
    opp[o].pts += gamePoints(g, player);
  });
  return opp;
}

function cumPct(player, games) {
  const pg = games.filter(g=>g['Player 1']===player||g['Player 2']===player);
  let w=0,t=0;
  return pg.map(g=>{
    t++;
    if(!g._draw&&g._winner===player) w++;
    return {x:t, y:Math.round(w/t*100), d:g._d};
  });
}

function cumPctByDate(player, games) {
  const pg = games.filter(g=>g['Player 1']===player||g['Player 2']===player);
  let w=0,t=0;
  return pg.map(g=>{
    t++;
    if(!g._draw&&g._winner===player) w++;
    return {x:g._d.getTime(), y:Math.round(w/t*100), d:g._d};
  });
}

function cumPtsByGame(player, games) {
  const pg = games.filter(g=>g['Player 1']===player||g['Player 2']===player);
  let cum=0;
  return pg.map((g,i)=>{
    cum += gamePoints(g, player);
    return {x:i+1, y:cum, d:g._d};
  });
}

function cumPtsByDate(player, games) {
  const pg = games.filter(g=>g['Player 1']===player||g['Player 2']===player);
  let cum=0;
  return pg.map(g=>{
    cum += gamePoints(g, player);
    return {x:g._d.getTime(), y:cum, d:g._d};
  });
}

function cumPtsDiff(p1, games) {
  let cum=0;
  return games.map((g,i)=>{
    cum += gamePoints(g, p1);
    return {x:i+1, y:cum, d:g._d};
  });
}

function byMonth(player, games) {
  const m={};
  games.filter(g=>g['Player 1']===player||g['Player 2']===player).forEach(g=>{
    if(!m[g._moFull]) m[g._moFull]={w:0,t:0};
    m[g._moFull].t++;
    if(!g._draw&&g._winner===player) m[g._moFull].w++;
  });
  return m;
}

function pointsByMonth(player, games) {
  const m={};
  games.filter(g=>g['Player 1']===player||g['Player 2']===player).forEach(g=>{
    if(!m[g._moFull]) m[g._moFull]=0;
    m[g._moFull] += gamePoints(g, player);
  });
  return m;
}

function streak(player, games) {
  const pg = games.filter(g=>g['Player 1']===player||g['Player 2']===player).slice().reverse();
  let cur=0, type='';
  for(const g of pg){
    const res = g._draw?'d':g._winner===player?'w':'l';
    if(!type){type=res; cur=1;}
    else if(res===type) cur++;
    else break;
  }
  return {cur,type};
}

function renderPlayer(p) {

  const s = pStats(p, SF, ptsPool);   // record/win% respect both filters; s.pts/s.avgPts are IRL-only within them
  const opp = h2h(p, SF, ptsPool);    // w/l/d respect both filters; opp[x].pts is IRL-only within them
  const sr = streak(p, SF);
  const col = pc(p);
  const strLabel = sr.type==='w'?'Win':sr.type==='l'?'Loss':'Draw';
  const strColor = sr.type==='w'?'var(--green)':sr.type==='l'?'var(--red)':'var(--accent)';

  const beaten = Object.entries(opp).sort((a,b)=>b[1].w-a[1].w);
  const hardest = Object.entries(opp).sort((a,b)=>b[1].l-a[1].l);

  const cards = Object.entries(opp).map(([o,r])=>{

        <span style="color:var(--accent)">${r.d}D</span>
        <span style="color:var(--red)">${r.l}L</span>

      borderColor:pmpts.map(v=>v>=0?'#4de8a8':'#e84d6f'),
      borderWidth:1,borderRadius:3}]},
    options:{
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${fmtPts(c.parsed.y)} pts`}}},
      scales:{
        x:axisOpts(),
        y:{...axisOpts('Net Points'),grid:{color:ctx=>ctx.tick.value===0?'rgba(255,255,255,.3)':gridColor}}
      },
      responsive:true,maintainAspectRatio:true
    }
  });
}

// ─── HEAD-TO-HEAD ─────────────────────────────────────────────────────────────
window._h2hColorMode = {p1:'both', p2:'both'}; // 'both' | 'White' | 'Black' — per-player color filters

function setH2HColorMode(which, mode, el) {
  const key = 'p'+which;
  if(window._h2hColorMode[key]===mode) return;
  window._h2hColorMode[key] = mode;
  el.parentElement.querySelectorAll('.pill').forEach(p=>{
    p.classList.remove('on');
    p.style.background=''; p.style.color=''; p.style.borderColor='';
  });
  el.classList.add('on');
  el.style.background='var(--accent)';
  el.style.color='#0d0d0f';
  el.style.borderColor='var(--accent)';
  renderH2H();
}

function buildH2H() {
  const el = document.getElementById('pane-h2h');
  const p1 = PLAYERS.includes('John')?'John':PLAYERS[0];
  const p2 = PLAYERS.includes('Josh')?'Josh':PLAYERS[1];
  const colorPills = which => `
      <div class="pill on" style="background:var(--accent);color:#0d0d0f;border-color:var(--accent)" onclick="setH2HColorMode(${which},'both',this)">Both</div>
      <div class="pill" onclick="setH2HColorMode(${which},'White',this)">White</div>
      <div class="pill" onclick="setH2HColorMode(${which},'Black',this)">Black</div>`;
  el.innerHTML = `
    <div class="ctrls">
      <label>Player 1</label>
      <select id="h2h-p1" onchange="renderH2H()">
        ${PLAYERS.map(p=>`<option ${p===p1?'selected':''}>${p}</option>`).join('')}
      </select>
      <label>vs</label>
      <select id="h2h-p2" onchange="renderH2H()">
        ${PLAYERS.map(p=>`<option ${p===p2?'selected':''}>${p}</option>`).join('')}
      </select>
    </div>
    <div class="ctrls">
      <label>Player 1 playing as</label>
      ${colorPills(1)}
    </div>
    <div class="ctrls">
      <label>Player 2 playing as</label>
      ${colorPills(2)}
    </div>
    <div id="h2h-body"></div>
  `;
  renderH2H();
}

let h2hPage=1; const h2hPer=20; let h2hGames=[]; let h2hChrono=[];
function renderH2H() {
  const p1=document.getElementById('h2h-p1').value;
  const p2=document.getElementById('h2h-p2').value;
  const el=document.getElementById('h2h-body');
  if(p1===p2){el.innerHTML='<p style="color:var(--muted);font-family:DM Mono,monospace;font-size:12px;padding:1rem">Pick two different players.</p>';return;}

  const cm = window._h2hColorMode;
  const matchup = g => (g['Player 1']===p1&&g['Player 2']===p2)||(g['Player 1']===p2&&g['Player 2']===p1);
  const colorMatch = g => (cm.p1==='both'||playingAs(g,p1)===cm.p1) && (cm.p2==='both'||playingAs(g,p2)===cm.p2);
  h2hChrono = sourceFiltered(G).filter(matchup).filter(colorMatch);   // record + log respect the source toggle + color filters
  const h2hChronoIRL = GIRL.filter(matchup).filter(colorMatch);        // points are always IRL-only, ignoring the source toggle (but still color-filtered)
  h2hGames = h2hChrono.slice().reverse();
  let p1w=0,p2w=0,dr=0,p1pts=0;
  h2hChrono.forEach(g=>{
    if(g._draw) dr++;
    else if(g._winner===p1) p1w++;
    else p2w++;
  });
  h2hChronoIRL.forEach(g=>{ p1pts += gamePoints(g, p1); });
  const tot=h2hGames.length;
  const p1pct=tot?Math.round(p1w/tot*100):0;
  const p2pct=tot?Math.round(p2w/tot*100):0;

  h2hPage=1;
  el.innerHTML = `
    <div class="stat-grid" style="max-width:760px">
      <div class="stat"><div class="lbl">${p1} wins</div><div class="val" style="color:${pc(p1)}">${p1w}</div><div class="sub">${p1pct}%</div></div>
      <div class="stat"><div class="lbl">Draws</div><div class="val" style="color:var(--accent)">${dr}</div></div>
      <div class="stat"><div class="lbl">${p2} wins</div><div class="val" style="color:${pc(p2)}">${p2w}</div><div class="sub">${p2pct}%</div></div>
      <div class="stat"><div class="lbl">Total</div><div class="val">${tot}</div></div>
      <div class="stat"><div class="lbl">Point Diff<span class="irl-tag">IRL only</span></div><div class="val" style="color:${ptsColor(p1pts)}">${fmtPts(p1pts)}</div><div class="sub">${p1} perspective</div></div>
    </div>

    <div class="sec">Streak Momentum — ${p1} vs ${p2}</div>
    <p style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:1rem">
      Each bar is one game in the rivalry's chronological order — bar height tracks the running win streak (positive = ${p1} streak in green, negative = ${p2} streak in red). A win extends or flips the streak instantly; a draw holds it steady and renders in yellow.
    </p>
    <div class="cbox"><canvas id="c-h2h-momentum" height="90"></canvas></div>

    <div class="sec">Cumulative point differential <span class="irl-tag" style="font-size:9px">— IRL games only</span></div>
    <p style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:1rem">
      Running total of points ${p1} has gained over ${p2} across their shared in-person game history (Chess.com games are not part of the points system and never appear here). Above zero = ${p1} ahead, below zero = ${p2} ahead.
    </p>
    <div class="cbox"><canvas id="c-h2h-pts"></canvas></div>

    <div class="sec">${p1} vs ${p2} — game log</div>
    <div id="h2h-tbl"></div>
  `;

  // Streak Momentum — running win-streak value per game. A win extends the
  // current streak (or flips it to ±1 if the other player was on a streak);
  // a draw holds the streak steady and renders in yellow. Respects the
  // source toggle + color filters.
  let streakVal = 0;
  const momLabels = h2hChrono.map((g,i)=>String(i+1));
  const momDraw = h2hChrono.map(g=>!!g._draw);
  const momValues = h2hChrono.map(g=>{
    if(g._draw) return streakVal;
    streakVal = g._winner===p1
      ? (streakVal<0 ? 1 : streakVal+1)
      : (streakVal>0 ? -1 : streakVal-1);
    return streakVal;
  });
  const momDates = h2hChrono.map(g=>g._d);
  const momMin = Math.min(0,...momValues)-1;
  const momMax = Math.max(0,...momValues)+1;
  dc('h2h-momentum');
  charts['h2h-momentum']=new Chart(document.getElementById('c-h2h-momentum'),{
    type:'bar',
    data:{labels:momLabels,datasets:[{
      data:momValues,
      backgroundColor:momValues.map((v,i)=>momDraw[i]?'#e8d44d':v>0?'#4de8a8':v<0?'#e84d6f':'transparent'),
      borderWidth:0,
      borderRadius:1,
      barPercentage:1.0,
      categoryPercentage:1.0
    }]},
    options:{
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{
          title:items=>items.length?`Game ${items[0].label} — ${momDates[items[0].dataIndex].toLocaleDateString()}`:'',
          label:c=>momDraw[c.dataIndex]?`Draw — streak holds at ${c.parsed.y}`:`${c.parsed.y>0?p1:p2} streak: ${Math.abs(c.parsed.y)}`
        }}
      },
      scales:{
        x:{...axisOpts('Game #'),ticks:{...axisOpts().ticks,maxTicksLimit:24,autoSkip:true},grid:{display:false}},
        y:{min:momMin,max:momMax,...axisOpts(),ticks:{...axisOpts().ticks,stepSize:1},grid:{color:ctx=>ctx.tick.value===0?'rgba(255,255,255,.3)':gridColor}}
      },
      responsive:true,maintainAspectRatio:true
    }
  });

  dc('h2h-pts');
  charts['h2h-pts']=new Chart(document.getElementById('c-h2h-pts'),{
    type:'line',
    data:{datasets:[{
      label:`${p1} vs ${p2} — pt diff`,
      data:cumPtsDiff(p1,h2hChronoIRL),
      borderColor:pc(p1),
      backgroundColor:'transparent',
      tension:0.2,
      pointRadius:0,
      pointHoverRadius:5,
      borderWidth:2.5
    }]},
    options:{
      parsing:false,
      plugins:{
        legend:{labels:{color:'#f0ede6',font:{family:'DM Mono',size:11},padding:14}},
        tooltip:{callbacks:{
          title:items=>items.length?`Game ${items[0].parsed.x} — ${items[0].raw.d.toLocaleDateString()}`:'',
          label:c=>`${fmtPts(c.parsed.y)} pts (${p1} perspective)`
        }}
      },
      scales:{
        x:{type:'linear',...axisOpts('Game #')},
        y:{...axisOpts('Cumulative Pt Diff'),grid:{color:ctx=>ctx.tick.value===0?'rgba(255,255,255,.3)':gridColor}}
      },
      responsive:true,maintainAspectRatio:true,
      interaction:{mode:'index',intersect:false}
    }
  });

  renderH2HTable(p1,p2);
}

function renderH2HTable(p1,p2) {
  const slice=h2hGames.slice((h2hPage-1)*h2hPer, h2hPage*h2hPer);
  const total=Math.ceil(h2hGames.length/h2hPer);
  const rows=slice.map(g=>{
    const isOnline = g.source!=='IRL';
    const marginCell = isOnline ? 'Online' : (g._diff?Math.abs(g._diff):'—');
    const ptsCell = isOnline ? 'Online' : fmtPts(gamePoints(g,p1));
    return `<tr>
    <td style="color:var(--muted)">${g['Game ID']}</td>
    <td>${g._d.toLocaleDateString()}</td>
    <td style="color:${pc(g['Player 1'])}">${g['Player 1']}</td>
    <td style="color:var(--muted);font-size:10px">${g['Color 1']}</td>
    <td style="color:${pc(g['Player 2'])}">${g['Player 2']}</td>
    <td style="color:var(--muted);font-size:10px">${g['Color 2']}</td>
    <td><span class="bdg ${g._draw?'bdg-d':g._winner===p1?'bdg-w':'bdg-l'}">${g._draw?'Draw':g._winner}</span></td>
    <td style="text-align:right;color:${isOnline?'var(--blue)':Math.abs(g._diff)>10?'var(--red)':'var(--muted)'}" title="${marginTooltip(g)}">${marginCell}</td>
    <td style="text-align:right;color:${isOnline?'var(--blue)':ptsColor(gamePoints(g,p1))}" title="${isOnline?'Chess.com games are not part of the points system':'Pts gained/lost by '+p1+' this game'}">${ptsCell}</td>
    <td style="color:var(--muted);font-size:11px">${g['Notes']||''}</td>
  </tr>`;}).join('');

  const pgs=buildPages(h2hPage,total,'h2hPage','renderH2HTable(\''+p1+'\',\''+p2+'\')');
  document.getElementById('h2h-tbl').innerHTML=`
    <div class="tbl-wrap">
      <table><thead><tr><th>#</th><th>Date</th><th>P1</th><th>Color</th><th>P2</th><th>Color</th><th>Result</th><th>Margin</th><th>Pts (${p1})</th><th>Notes</th></tr></thead>
      <tbody>${rows}</tbody></table>
    </div>
    <div class="pages"><span>${h2hGames.length} games</span>${pgs}</div>
  `;
}

// ─── COMPARE ──────────────────────────────────────────────────────────────────
function buildCompare() {
  const el = document.getElementById('pane-compare');
  const p1def = PLAYERS.includes('John')?'John':PLAYERS[0];
  const p2def = PLAYERS.includes('Josh')?'Josh':(PLAYERS[1]||'');

  const noteSet = new Set();
  G.forEach(g=>{
    const n=(g['Notes']||'').trim();
    noteSet.add(n===''?'No note':n);
  });
  const notes=[...noteSet].sort((a,b)=> a==='No note'?-1 : b==='No note'?1 : a.localeCompare(b));

  const minDate = G[0]._d.toISOString().slice(0,10);
  const maxDate = G[G.length-1]._d.toISOString().slice(0,10);
  window._cmpMin = minDate;
  window._cmpMax = maxDate;

  el.innerHTML = `
    <div class="ctrls">
      <label>Player 1</label>
      <select id="cmp-p1" onchange="renderCompare()">
        ${PLAYERS.map(p=>`<option ${p===p1def?'selected':''}>${p}</option>`).join('')}
      </select>
      <label>Player 2</label>
      <select id="cmp-p2" onchange="renderCompare()">
        <option value="">All opponents</option>
        ${PLAYERS.map(p=>`<option ${p===p2def?'selected':''}>${p}</option>`).join('')}
      </select>
    </div>
    <div class="ctrls">
      <label>From</label>
      <input type="date" id="cmp-start" value="${minDate}" min="${minDate}" max="${maxDate}" onchange="renderCompare()">
      <label>To</label>
      <input type="date" id="cmp-end" value="${maxDate}" min="${minDate}" max="${maxDate}" onchange="renderCompare()">
      <div class="pill" onclick="cmpQuickRange('all')">All time</div>
      <div class="pill" onclick="cmpQuickRange('year')">This year</div>
      <div class="pill" onclick="cmpQuickRange('6mo')">Last 6 months</div>
      <div class="pill" onclick="cmpQuickRange('3mo')">Last 3 months</div>
    </div>
    <div class="ctrls">
      <label>Note</label>
      <select id="cmp-note" onchange="renderCompare()">
        <option value="">All</option>
        ${notes.map(n=>`<option>${n}</option>`).join('')}
      </select>
      <div class="pill" onclick="clearCompare()" style="margin-left:auto;color:var(--accent);border-color:var(--accent)">Clear filters</div>
    </div>
    <div id="compare-body"></div>
  `;
  renderCompare();
}

function cmpQuickRange(type) {
  const max = new Date(window._cmpMax);
  let start;
  if(type==='all') start = new Date(window._cmpMin);
  else if(type==='year') start = new Date(max.getFullYear(),0,1);
  else if(type==='6mo'){ start=new Date(max); start.setMonth(start.getMonth()-6); }
  else if(type==='3mo'){ start=new Date(max); start.setMonth(start.getMonth()-3); }
  let startStr = start.toISOString().slice(0,10);
  if(startStr < window._cmpMin) startStr = window._cmpMin;
  document.getElementById('cmp-start').value = startStr;
  document.getElementById('cmp-end').value = window._cmpMax;
  renderCompare();
}

function clearCompare() {
  const p1def = PLAYERS.includes('John')?'John':PLAYERS[0];
  document.getElementById('cmp-p1').value = p1def;
  document.getElementById('cmp-p2').value = '';
  document.getElementById('cmp-start').value = window._cmpMin;
  document.getElementById('cmp-end').value = window._cmpMax;
  document.getElementById('cmp-note').value = '';
  renderCompare();
}

let cmpPage=1; const cmpPer=20; let cmpGames=[];
function renderCompare() {
  const p1 = document.getElementById('cmp-p1').value;
  const p2 = document.getElementById('cmp-p2').value;
  const startStr = document.getElementById('cmp-start').value;
  const endStr = document.getElementById('cmp-end').value;
  const note = document.getElementById('cmp-note').value;
  const start = startStr ? new Date(startStr) : null;
  const end = endStr ? new Date(endStr) : null;
  if(end) end.setHours(23,59,59,999);

  const matchesFilters = g => {
    if(g['Player 1']!==p1 && g['Player 2']!==p1) return false;
    if(p2 && g['Player 1']!==p2 && g['Player 2']!==p2) return false;
    if(start && g._d < start) return false;
    if(end && g._d > end) return false;
    if(note){
      const n=(g['Notes']||'').trim();
      if((n===''?'No note':n)!==note) return false;
    }
    return true;
  };

  const filtered = sourceFiltered(G).filter(matchesFilters);   // record/log/chart respect the source toggle
  const filteredIRL = GIRL.filter(matchesFilters);              // points ignore the toggle — always IRL only

  let w=0,l=0,d=0;
  filtered.forEach(g=>{
    if(g._draw) d++;
    else if(g._winner===p1) w++;
    else l++;
  });
  let pts=0;
  filteredIRL.forEach(g=>{ pts += gamePoints(g, p1); });
  const t=w+l+d, pct=t?Math.round(w/t*100):0;
  const avgPts=filteredIRL.length?+(pts/filteredIRL.length).toFixed(1):0;
  const col=pc(p1);

  cmpPage=1;
  cmpGames = filtered.slice().reverse();

  document.getElementById('compare-body').innerHTML = `
    <div class="stat-grid" style="max-width:760px">
      <div class="stat"><div class="lbl">${p1} Win %</div><div class="val" style="color:${col}">${pct}%</div></div>
      <div class="stat"><div class="lbl">Wins</div><div class="val" style="color:var(--green)">${w}</div></div>
      <div class="stat"><div class="lbl">Losses</div><div class="val" style="color:var(--red)">${l}</div></div>
      <div class="stat"><div class="lbl">Draws</div><div class="val" style="color:var(--accent)">${d}</div></div>
      <div class="stat"><div class="lbl">Games</div><div class="val">${t}</div></div>
      <div class="stat"><div class="lbl">Total Pts<span class="irl-tag">IRL only</span></div><div class="val" style="color:${ptsColor(pts)}">${fmtPts(pts)}</div></div>
      <div class="stat"><div class="lbl">Avg Pts<span class="irl-tag">IRL only</span></div><div class="val" style="color:${ptsColor(avgPts)}">${fmtPts(avgPts)}</div></div>
    </div>

    <div class="sec">Game by Game Results — ${p1}</div>
    ${filtered.length ? `
      <p style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:1rem">
        Each bar is one game in chronological order across ${p2 ? `${p1}'s filtered games against ${p2}` : `all of ${p1}'s filtered games`} — green bars above the line are wins, red bars below are losses, and draws leave a gap.
      </p>
      <div class="cbox"><canvas id="c-cmp-momentum"></canvas></div>
    ` : `
      <p style="font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);padding:1rem 0">No games match the current filters</p>
    `}

    <div class="sec">Game log</div>
    <div id="cmp-tbl"></div>
  `;

  if(filtered.length){
    // one independent bar per game from p1's perspective: +1 win (green),
    // -1 loss (red), draws render no bar (null leaves a gap). No cumulative total.
    const resLabels = filtered.map((g,i)=>String(i+1));
    const resValues = filtered.map(g=> g._draw ? null : (g._winner===p1 ? 1 : -1));
    const resDates = filtered.map(g=>g._d);

    dc('cmp-momentum');
    charts['cmp-momentum']=new Chart(document.getElementById('c-cmp-momentum'),{
      type:'bar',
      data:{labels:resLabels,datasets:[{
        data:resValues,
        backgroundColor:resValues.map(v=>v>0?'#4de8a8':v<0?'#e84d6f':'transparent'),
        borderWidth:0,
        borderRadius:1,
        barPercentage:1.0,
        categoryPercentage:1.0
      }]},
      options:{
        plugins:{
          legend:{display:false},
          tooltip:{callbacks:{
            title:items=>items.length?`Game ${items[0].label} — ${resDates[items[0].dataIndex].toLocaleDateString()}`:'',
            label:c=>c.parsed.y>0?`${p1} won`:c.parsed.y<0?`${p1} lost`:'Draw'
          }}
        },
        scales:{
          x:{...axisOpts('Game #'),ticks:{...axisOpts().ticks,maxTicksLimit:24,autoSkip:true},grid:{display:false}},
          y:{min:-1.5,max:1.5,...axisOpts(),ticks:{...axisOpts().ticks,stepSize:1},grid:{color:ctx=>ctx.tick.value===0?'rgba(255,255,255,.3)':gridColor}}
        },
        responsive:true,maintainAspectRatio:true
      }
    });
  } else {
    dc('cmp-momentum');
  }

  renderCompareTable(p1);
}

function renderCompareTable(p1) {
  const slice=cmpGames.slice((cmpPage-1)*cmpPer, cmpPage*cmpPer);
  const total=Math.ceil(cmpGames.length/cmpPer);
  const rows=slice.map(g=>{
    const isOnline = g.source!=='IRL';
    const marginCell = isOnline ? 'Online' : (g._diff?Math.abs(g._diff):'—');
    const ptsCell = isOnline ? 'Online' : fmtPts(gamePoints(g,p1));
    return `<tr>
    <td style="color:var(--muted)">${g['Game ID']}</td>
    <td>${g._d.toLocaleDateString()}</td>
    <td style="color:${pc(g['Player 1'])}">${g['Player 1']}</td>
    <td style="color:${pc(g['Player 2'])}">${g['Player 2']}</td>
    <td><span class="bdg ${g._draw?'bdg-d':'bdg-w'}" style="${g._draw?'':'background:'+pc(g._winner||'')+'18;color:'+pc(g._winner||'')}">${g._draw?'Draw':g._winner}</span></td>
    <td style="text-align:right;color:${isOnline?'var(--blue)':Math.abs(g._diff)>10?'var(--red)':'var(--muted)'}" title="${marginTooltip(g)}">${marginCell}</td>
    <td style="text-align:right;color:${isOnline?'var(--blue)':ptsColor(gamePoints(g,p1))}" title="${isOnline?'Chess.com games are not part of the points system':'Pts gained/lost by '+p1+' this game'}">${ptsCell}</td>
    <td style="color:var(--muted);font-size:11px;max-width:200px;overflow:hidden;text-overflow:ellipsis">${g['Notes']||''}</td>
  </tr>`;}).join('');

  const pgs=buildPages(cmpPage,total,'cmpPage','renderCompareTable(\''+p1+'\')');
  document.getElementById('cmp-tbl').innerHTML=`
    <div class="tbl-wrap">
      <table><thead><tr><th>#</th><th>Date</th><th>Player 1</th><th>Player 2</th><th>Winner</th><th>Margin</th><th>Pts (${p1})</th><th>Notes</th></tr></thead>
      <tbody>${rows}</tbody></table>
    </div>
    <div class="pages"><span>${cmpGames.length} games</span>${pgs}</div>
  `;
}

      </div>
    </div>
    <div class="ctrls">
      <label>X-axis</label>
      <div style="display:flex;gap:6px" id="run-mode-pills">
        <div class="pill on" data-mode="game" style="background:var(--accent);color:#0d0d0f;border-color:var(--accent)" onclick="setRunMode('game',this)">By Game #</div>
        <div class="pill" data-mode="date" onclick="setRunMode('date',this)">By Date</div>
      </div>
    </div>
    <div class="ctrls">
      <label>Toggle players</label>
      <div style="display:flex;flex-wrap:wrap;gap:6px" id="run-pills">
        ${main.map(p=>`<div class="pill on" style="background:${pc(p)};color:#0d0d0f;border-color:${pc(p)}" data-p="${p}" onclick="toggleRun('${p}',this)">${p}</div>`).join('')}
      </div>
    </div>
    <div class="cbox" style="height:360px"><canvas id="c-running"></canvas></div>
  `;
  renderRunning();
}

function toggleRun(p, el) {
  if(window._runActive.has(p)){window._runActive.delete(p);el.classList.remove('on');el.style.background='';el.style.color='';el.style.borderColor='';}
  else{window._runActive.add(p);el.classList.add('on');el.style.background=pc(p);el.style.color='#0d0d0f';el.style.borderColor=pc(p);}
  renderRunning();
}

function setRunMode(mode, el) {
  if(window._runMode===mode) return;
  window._runMode=mode;
  document.querySelectorAll('#run-mode-pills .pill').forEach(p=>{
    p.classList.remove('on');
    p.style.background=''; p.style.color=''; p.style.borderColor='';
  });
  el.classList.add('on');
  el.style.background='var(--accent)';
  el.style.color='#0d0d0f';
  el.style.borderColor='var(--accent)';
  renderRunning();
}

function setRunView(view, el) {
  if(window._runView===view) return;
  window._runView=view;
  document.querySelectorAll('#run-view-pills .pill').forEach(p=>{
    p.classList.remove('on');
    p.style.background=''; p.style.color=''; p.style.borderColor='';
  });
  el.classList.add('on');
  el.style.background='var(--accent)';
  el.style.color='#0d0d0f';
  el.style.borderColor='var(--accent)';
  renderRunning();
}

function renderRunning() {
  const players=[...window._runActive];
  const mode = window._runMode||'game';
  const view = window._runView||'winpct';
  const isPts = view==='points';

  document.getElementById('run-sec-title').textContent = isPts
    ? 'Cumulative points — IRL games only'
    : 'Cumulative win% — every game counts';
  document.getElementById('run-desc').textContent = isPts
    ? 'Each player starts at 0. A win adds the recorded differential exactly as logged (it can be negative); a loss subtracts the winner’s differential. Draws and ungraded games add nothing. Chess.com games are not part of the points system — they never move this line, never appear as markers, and are unaffected by the source toggle above.'
    : 'Game 1 win = 100%. Game 2 loss = 50%. Game 3 win = 66%. Each dot is one game played. Respects the source toggle above.';

  // Win% always respects the global source toggle; cumulative points is IRL-only,
  // always — Chess.com games are filtered out of the dataset entirely (GIRL) so
  // they cannot appear as data points, markers, or gaps on the line in any form.
  const ds=players.map(p=>({
    label:p,
    data: isPts
      ? (mode==='date' ? cumPtsByDate(p,GIRL) : cumPtsByGame(p,GIRL))
      : (mode==='date' ? cumPctByDate(p,sourceFiltered(G)) : cumPct(p,sourceFiltered(G))),
    borderColor:pc(p),
    backgroundColor:'transparent',
    tension:0.25,
    pointRadius:0,
    pointHoverRadius:5,
    borderWidth:2.5
  }));
  dc('running');

  const xScale = mode==='date'
    ? {type:'linear',grid:{color:gridColor},
       title:{display:true,text:'Date',color:'#6b6b7a',font:{size:10}},
       ticks:{color:'#6b6b7a',callback:v=>new Date(v).toLocaleDateString('en-US',{month:'short',year:'2-digit'})}}
    : {type:'linear',...axisOpts('Game #')};

  const yScale = isPts
    ? {...axisOpts('Cumulative Points'),grid:{color:ctx=>ctx.tick.value===0?'rgba(255,255,255,.3)':gridColor}}
    : {min:0,max:100,...axisOpts('Win %'),ticks:{color:'#6b6b7a',callback:v=>v+'%'}};

  const tooltipCallbacks={};
  if(mode==='date') tooltipCallbacks.title = items=>items.length?new Date(items[0].parsed.x).toLocaleDateString():'';
  if(isPts) tooltipCallbacks.label = c=>`${c.dataset.label}: ${fmtPts(c.parsed.y)} pts`;

  charts['running']=new Chart(document.getElementById('c-running'),{
    type:'line',data:{datasets:ds},
    options:{
      parsing:false,
      plugins:{
        legend:{labels:{color:'#f0ede6',font:{family:'DM Mono',size:11},padding:14}},
        tooltip:{callbacks:tooltipCallbacks}
      },
      scales:{
        x:xScale,
        y:yScale
      },
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false}
    }
  });
  document.getElementById('c-running').parentElement.style.height='360px';
}

// ─── ALL GAMES ────────────────────────────────────────────────────────────────
let gPage=1; const gPer=25; let gFiltered=[];
function buildGames() {
  const el=document.getElementById('pane-games');
  el.innerHTML=`
    <div class="ctrls">
      <label>Player</label>
      <select id="gp" onchange="filterG()">
        <option value="">All</option>
        ${PLAYERS.map(p=>`<option>${p}</option>`).join('')}
      </select>
      <label>Result</label>
      <select id="gr" onchange="filterG()">
        <option value="">All</option>
        <option value="win">Wins</option>
        <option value="loss">Losses</option>
        <option value="draw">Draws</option>
      </select>
      <label>Color</label>
      <select id="gc" onchange="filterG()">
        <option value="">Any</option>
        <option>White</option>
        <option>Black</option>
      </select>
      <input type="text" id="gs" placeholder="Search notes, player..." oninput="filterG()" style="width:190px">
    </div>
    <div id="g-tbl"></div>
  `;
  gFiltered=[...sourceFiltered(G)].reverse();
  renderGames();
}

function filterG() {
  const pl=document.getElementById('gp').value;
  const res=document.getElementById('gr').value;
  const col=document.getElementById('gc').value;
  const srch=document.getElementById('gs').value.toLowerCase();
  gFiltered=[...sourceFiltered(G)].reverse().filter(g=>{
    if(pl){
      if(g['Player 1']!==pl&&g['Player 2']!==pl) return false;
      if(res==='win'&&(g._draw||g._winner!==pl)) return false;
      if(res==='loss'&&(g._draw||g._loser!==pl)) return false;
      if(col){
        const gc2=(g['Player 1']===pl?g['Color 1']:g['Color 2']);
        if(gc2!==col) return false;
      }
    } else {
      if(res==='draw'&&!g._draw) return false;
    }
    if(srch&&!(g['Player 1'].toLowerCase().includes(srch)||g['Player 2'].toLowerCase().includes(srch)||(g['Notes']||'').toLowerCase().includes(srch)||(g['Winner']||'').toLowerCase().includes(srch))) return false;
    return true;
  });
  gPage=1; renderGames();
}

function renderGames() {
  const slice=gFiltered.slice((gPage-1)*gPer,gPage*gPer);
  const total=Math.ceil(gFiltered.length/gPer);
  const rows=slice.map(g=>{
    const isOnline = g.source!=='IRL';
    const diffCell = isOnline ? 'Online' : (g._diff || g._diff===0 ? (g._diff>0?'+':'')+g._diff : '—');
    const diffColor = isOnline ? 'var(--blue)' : (Math.abs(g._diff)>15?'var(--red)':Math.abs(g._diff)>8?'var(--accent)':'var(--muted)');
    return `<tr>
    <td style="color:var(--muted)">${g['Game ID']}</td>
    <td>${g._d.toLocaleDateString()}</td>
    <td style="color:${pc(g['Player 1'])}">${g['Player 1']}</td>
    <td style="color:var(--muted);font-size:10px">${g['Color 1']}</td>
    <td style="color:${pc(g['Player 2'])}">${g['Player 2']}</td>
    <td style="color:var(--muted);font-size:10px">${g['Color 2']}</td>
    <td><span class="bdg ${g._draw?'bdg-d':'bdg-w'}" style="${g._draw?'':'background:'+pc(g._winner||'')+'18;color:'+pc(g._winner||'')}">${g._draw?'Draw':g._winner}</span></td>
    <td style="text-align:right;color:${diffColor}" title="${marginTooltip(g)}">${diffCell}</td>
    <td><span class="bdg" style="background:${isOnline?'rgba(77,159,232,.12)':'rgba(232,212,77,.12)'};color:${isOnline?'var(--blue)':'var(--accent)'}">${g.source}</span></td>
    <td style="color:var(--muted);font-size:11px;max-width:160px;overflow:hidden;text-overflow:ellipsis">${g['Notes']||''}</td>
  </tr>`;}).join('');
  const pgs=buildPages(gPage,total,'gPage','renderGames()');
  document.getElementById('g-tbl').innerHTML=`
    <div class="tbl-wrap">
      <table><thead><tr><th>#</th><th>Date</th><th>Player 1</th><th>Color</th><th>Player 2</th><th>Color</th><th>Winner</th><th>Differential</th><th>Source</th><th>Notes</th></tr></thead>
      <tbody>${rows}</tbody></table>
    </div>
    <div class="pages"><span>${gFiltered.length} games</span>${pgs}</div>
  `;
}

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function buildPages(cur, total, varName, fn) {
  if(total<=1) return '';
  let html='';
  for(let i=1;i<=total;i++){
    if(i===1||i===total||Math.abs(i-cur)<=1){
      html+=`<button class="pg ${i===cur?'on':''}" onclick="${varName}=${i};${fn}">${i}</button>`;
    } else if(Math.abs(i-cur)===2){
      html+='<span style="color:var(--muted)">…</span>';
    }
  }
  return html;
}

// ─── CHANGELOG ────────────────────────────────────────────────────────────────
const CHANGELOG_URL = 'https://api.github.com/repos/jstrevens1/chess-dashboard/commits?per_page=50';
let _changelogLoaded = false;

// fetched only when the Changelog tab is first opened, not on initial page load
function loadChangelog() {
  if(_changelogLoaded) return;
  _changelogLoaded = true;

  const el = document.getElementById('pane-changelog');
  el.innerHTML = `
    <div class="hdr-title" style="font-size:2.4rem;margin-bottom:.25rem">Changelog</div>
    <p style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:1.75rem">A running history of every update to the dashboard</p>
    <div class="loading" id="changelog-status" style="height:auto;padding:3rem 0">
      <div class="spinner"></div>
    </div>
  `;

  fetch(CHANGELOG_URL)
    .then(res => { if(!res.ok) throw new Error('HTTP '+res.status); return res.json(); })
    .then(commits => renderChangelog(Array.isArray(commits) ? commits : []))
    .catch(() => {
      document.getElementById('changelog-status').outerHTML =
        `<p style="font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);padding:1rem 0">Changelog unavailable — could not reach GitHub</p>`;
    });
}

function renderChangelog(commits) {
  const status = document.getElementById('changelog-status');
  if(!commits.length){
    status.outerHTML = `<p style="font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);padding:1rem 0">No updates yet</p>`;
    return;
  }

  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  const items = commits.map((c,i) => {
    const d = new Date(c.commit.author.date);
    const dateStr = `${d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})} · ${d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true})}`;
    const msg = esc((c.commit.message||'').split('\n')[0]);
    const sha = c.sha;
    return `
      <div class="cl-item ${i===0?'latest':''}">
        <div class="cl-dot"></div>
        <div class="cl-card" onclick="toggleChangelogCard('${sha}',this)">
          <div class="cl-card-head">
            <div>
              <div class="cl-date">${dateStr}</div>
              <div class="cl-msg">${msg}</div>
              <div class="cl-meta"><span class="cl-sha">${sha.slice(0,7)}</span></div>
            </div>
            <div class="cl-chevron">▾</div>
          </div>
          <div class="cl-detail" id="cl-detail-${sha}"><div class="cl-detail-inner"></div></div>
        </div>
      </div>`;
  }).join('');

  status.outerHTML = `<div class="cl-timeline">${items}</div>`;
}

let _clOpenSha = null;
const _clDetailCache = {};

// expands/collapses a commit card; only one stays open at a time, and the
// full detail (incl. files changed) is fetched lazily on first expansion
function toggleChangelogCard(sha, cardEl) {
  const item = cardEl.closest('.cl-item');
  const wasOpen = item.classList.contains('open');

  document.querySelectorAll('.cl-item.open').forEach(el => el.classList.remove('open'));
  if(wasOpen){ _clOpenSha = null; return; }

  item.classList.add('open');
  _clOpenSha = sha;

  const inner = document.querySelector(`#cl-detail-${sha} .cl-detail-inner`);
  if(_clDetailCache[sha]){ inner.innerHTML = _clDetailCache[sha]; return; }

  inner.innerHTML = `<div style="display:flex;align-items:center;gap:.6rem;color:var(--muted);font-family:'DM Mono',monospace;font-size:11px"><div class="spinner" style="width:20px;height:20px"></div> Loading…</div>`;

  fetch(`https://api.github.com/repos/jstrevens1/chess-dashboard/commits/${sha}`)
    .then(res => { if(!res.ok) throw new Error('HTTP '+res.status); return res.json(); })
    .then(data => {
      const html = renderChangelogDetail(data);
      _clDetailCache[sha] = html;
      const live = document.querySelector(`#cl-detail-${sha} .cl-detail-inner`);
      if(live) live.innerHTML = html;
    })
    .catch(() => {
      const live = document.querySelector(`#cl-detail-${sha} .cl-detail-inner`);
      if(live) live.innerHTML = `<p style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)">Could not load commit details</p>`;
    });
}

function renderChangelogDetail(c) {
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const d = new Date(c.commit.author.date);
  const exact = d.toLocaleString('en-US',{month:'long',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true});
  const files = c.files || [];

  const fileRows = files.length
    ? files.map(f => `
        <div class="cl-file">
          <span class="cl-file-name" title="${esc(f.filename)}">${esc(f.filename)}</span>
          <span class="cl-file-stats"><span style="color:var(--green)">+${f.additions}</span> <span style="color:var(--red)">-${f.deletions}</span></span>
        </div>`).join('')
    : `<p style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)">No file changes recorded</p>`;

  return `
    <div class="cl-detail-row">
      <span class="cl-detail-lbl">Full message</span>
      <div class="cl-detail-msg">${esc(c.commit.message)}</div>
    </div>
    <div class="cl-detail-row">
      <span class="cl-detail-lbl">SHA</span>
      <span class="cl-detail-val">${c.sha}</span>
    </div>
    <div class="cl-detail-row">
      <span class="cl-detail-lbl">Author</span>
      <span class="cl-detail-val">${esc(c.commit.author.name)} &lt;${esc(c.commit.author.email)}&gt;</span>
    </div>
    <div class="cl-detail-row">
      <span class="cl-detail-lbl">Date</span>
      <span class="cl-detail-val">${exact}</span>
    </div>
    <div class="cl-detail-row">
      <span class="cl-detail-lbl">Files changed (${files.length})</span>
      <div class="cl-files">${fileRows}</div>
    </div>`;
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
async function startApp() {
  try {
    const res = await fetch(CSV_URL);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const text = await res.text();
    const games = parseData(text);
    if(!games.length) throw new Error('No games parsed');
    boot(games);
    loadChessCom(games[0]._d); // appends in the background once ready — sheet renders first regardless
  } catch(e) {
    document.getElementById('app').innerHTML=`<div class="err">
      Could not load data from Google Sheets.<br><br>
      Make sure the sheet is shared: Share → Anyone with the link → Viewer<br><br>
      Error: ${e.message}<br>
      Sheet ID: ${SHEET_ID}
    </div>`;
    document.getElementById('meta').textContent='Error loading data';
  }
}

// fetches Chess.com data in the background and appends it once ready, without
// re-rendering the page from scratch — the Google Sheet view is already live
async function loadChessCom(startDate) {
  setCCStatus('<span style="color:var(--blue)">⏳ Loading Chess.com games…</span>');
  try {
    const onlineGames = await fetchChessCom(startDate);
    mergeOnline(onlineGames);
    setCCStatus(onlineGames.length
      ? `<span style="color:var(--blue)">+${onlineGames.length} Chess.com game${onlineGames.length===1?'':'s'} loaded</span>`
      : `<span style="color:var(--muted)">No Chess.com games found between the friend group</span>`);
  } catch(e) {
    setCCStatus(''); // Chess.com fetch failing must never break the dashboard — fail silently
  }
}

function mergeOnline(onlineGames) {
  if(!onlineGames.length) return;
  G = G.concat(onlineGames).sort((a,b)=>a._d-b._d);
  GIRL = G.filter(g=>g.source==='IRL');
  PLAYERS = getPlayers(G);
  refreshAll();
  updateMeta();
}

// ─── PASSWORD GATE ────────────────────────────────────────────────────────────
const GATE_PASSWORD = 'neighneigh';
const GATE_KEY = 'chessNightAuthed';

function unlockGate() {
  document.getElementById('gate').remove();
  startApp();
}

(() => {
  const gate = document.getElementById('gate');
  if(sessionStorage.getItem(GATE_KEY)==='1'){ gate.remove(); startApp(); return; }

  const form = document.getElementById('gate-form');
  const input = document.getElementById('gate-input');
  const err = document.getElementById('gate-err');

  form.addEventListener('submit', e => {
    e.preventDefault();
    if(input.value === GATE_PASSWORD){
      sessionStorage.setItem(GATE_KEY, '1');
      unlockGate();
    } else {
      err.classList.add('show');
      input.classList.remove('shake');
      void input.offsetWidth; // restart animation
      input.classList.add('shake');
      input.value = '';
      input.focus();
    }
  });
})();
</script>
