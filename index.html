<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Night</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --bg:#0d0d0f; --s1:#141418; --s2:#1c1c22; --s3:#222228;
  --border:#2a2a32; --border2:#3a3a45;
  --accent:#e8d44d; --green:#4de8a8; --red:#e84d6f; --blue:#4d9fe8;
  --text:#f0ede6; --muted:#6b6b7a; --muted2:#4a4a58;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;min-height:100vh}

/* HEADER */
.hdr{padding:1.5rem 2rem 1rem;border-bottom:1px solid var(--border);display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:.75rem}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.2rem,5vw,4rem);letter-spacing:.04em;line-height:1;color:var(--accent)}
.hdr-title span{color:var(--text)}
.hdr-meta{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);text-align:right;line-height:1.7}

/* LOADING / ERROR */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:1rem}
.spinner{width:36px;height:36px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)}
.err{margin:2rem;padding:1.25rem;background:#180a0d;border:1px solid var(--red);border-radius:8px;font-family:'DM Mono',monospace;font-size:12px;color:var(--red);line-height:1.7}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);padding:0 2rem;overflow-x:auto;gap:0}
.tab{background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;padding:.8rem 1.1rem;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap;transition:color .15s}
.tab:hover{color:var(--text)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}

/* PANES */
.pane{display:none;padding:1.5rem 2rem 4rem}
.pane.on{display:block}

/* STAT GRID */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:1.75rem}
.stat{background:var(--s1);padding:1.1rem 1rem}
.stat .lbl{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.4rem}
.stat .val{font-family:'Bebas Neue',sans-serif;font-size:2rem;line-height:1}
.stat .sub{font-size:11px;color:var(--muted);margin-top:.2rem}

/* SECTION LABEL */
.sec{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:.06em;color:var(--muted);border-left:3px solid var(--accent);padding-left:.65rem;margin:1.75rem 0 .9rem}

/* CHART BOX */
.cbox{background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:1.1rem 1.25rem;margin-bottom:1.25rem}
.cbox canvas{max-height:280px}

/* CHART GRID */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin-bottom:1.25rem}
@media(max-width:680px){.cgrid{grid-template-columns:1fr}}

/* LEADERBOARD */
.lb{display:grid;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:1.75rem}
.lb-hdr,.lb-row{display:grid;grid-template-columns:44px 1fr 64px 64px 64px 64px 72px;align-items:center;padding:.75rem 1rem;gap:.5rem;background:var(--s1)}
.lb-hdr{background:var(--s2);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lb-row:hover{background:var(--s2)}
.lb-rank{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:var(--muted2)}
.lb-rank.gold{color:var(--accent)}
.lb-rank.silver{color:#aaa}
.lb-rank.bronze{color:#cd7f32}
.lb-name-wrap .name{font-family:'Bebas Neue',sans-serif;font-size:1.1rem}
.lb-bar{height:3px;background:var(--border2);border-radius:2px;margin-top:4px;overflow:hidden}
.lb-bar-fill{height:100%;border-radius:2px}
.lb-num{font-family:'DM Mono',monospace;font-size:12px;text-align:right}

/* H2H CARDS */
.h2h-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1rem;margin-bottom:1.5rem}
.h2h-card{background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:1.1rem}
.h2h-opp{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;margin-bottom:.25rem}
.h2h-pct{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;line-height:1;margin-bottom:.4rem}
.h2h-bar{height:5px;background:var(--border2);border-radius:3px;overflow:hidden;margin:.4rem 0}
.h2h-bar-fill{height:100%;border-radius:3px;transition:width .5s ease}
.h2h-nums{display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:10px;color:var(--muted)}

/* CONTROLS */
.ctrls{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:1.1rem}
.ctrls label{font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
select,input[type=text]{background:var(--s2);border:1px solid var(--border);color:var(--text);font-family:'DM Mono',monospace;font-size:12px;padding:.45rem .7rem;border-radius:6px;outline:none;cursor:pointer}
select:focus,input:focus{border-color:var(--accent)}
.pill{background:var(--s2);border:1px solid var(--border);color:var(--muted);font-family:'DM Mono',monospace;font-size:11px;padding:3px 11px;border-radius:20px;cursor:pointer;transition:all .15s;user-select:none}
.pill.on{color:var(--bg);border-color:transparent;font-weight:500}

/* TABLE */
.tbl-wrap{overflow-x:auto;background:var(--s1);border:1px solid var(--border);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:.65rem 1rem;text-align:left;border-bottom:1px solid var(--border);background:var(--s2);white-space:nowrap;cursor:pointer}
th:hover{color:var(--accent)}
td{padding:.55rem 1rem;border-bottom:1px solid var(--border);font-family:'DM Mono',monospace;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--s2)}
.bdg{display:inline-block;font-size:10px;padding:2px 6px;border-radius:4px;font-weight:500}
.bdg-w{background:rgba(77,232,168,.12);color:var(--green)}
.bdg-l{background:rgba(232,77,111,.12);color:var(--red)}
.bdg-d{background:rgba(232,212,77,.12);color:var(--accent)}

/* PAGINATION */
.pages{display:flex;gap:5px;justify-content:flex-end;padding:.6rem 1rem;align-items:center;font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);flex-wrap:wrap}
.pg{background:var(--s2);border:1px solid var(--border);color:var(--text);font-family:'DM Mono',monospace;font-size:11px;padding:3px 9px;border-radius:5px;cursor:pointer}
.pg:hover,.pg.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}

/* STREAK */
.streak-badge{display:inline-flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--border);border-radius:20px;padding:3px 12px;font-family:'DM Mono',monospace;font-size:11px}

@media(max-width:600px){
  .hdr,.pane,.tabs{padding-left:1rem;padding-right:1rem}
  .lb-hdr,.lb-row{grid-template-columns:36px 1fr 56px 56px 70px}
  .lb-hdr>*:nth-child(4),.lb-row>*:nth-child(4),
  .lb-hdr>*:nth-child(5),.lb-row>*:nth-child(5){display:none}
}

/* PASSWORD GATE */
.gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:1000;padding:1.5rem}
.gate-card{width:100%;max-width:340px;text-align:center}
.gate-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.4rem,8vw,3.4rem);letter-spacing:.04em;color:var(--accent);line-height:1;margin-bottom:.3rem}
.gate-title span{color:var(--text)}
.gate-sub{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:1.75rem;letter-spacing:.04em}
.gate-form{display:flex;flex-direction:column;gap:.7rem}
.gate-input{background:var(--s2);border:1px solid var(--border);color:var(--text);font-family:'DM Mono',monospace;font-size:14px;padding:.85rem 1rem;border-radius:8px;outline:none;text-align:center;letter-spacing:.08em;width:100%}
.gate-input:focus{border-color:var(--accent)}
.gate-input.shake{animation:gate-shake .4s}
.gate-btn{background:var(--accent);border:none;color:var(--bg);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;padding:.85rem 1rem;border-radius:8px;cursor:pointer;transition:filter .15s}
.gate-btn:hover{filter:brightness(1.08)}
.gate-err{font-family:'DM Mono',monospace;font-size:11px;color:var(--red);min-height:1.4em;margin-top:.5rem;opacity:0;transition:opacity .15s}
.gate-err.show{opacity:1}
@keyframes gate-shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-9px)}
  40%{transform:translateX(8px)}
  60%{transform:translateX(-6px)}
  80%{transform:translateX(4px)}
}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-title">Chess <span>Night</span></div>
    <div class="gate-sub">Enter the password to view the dashboard</div>
    <form class="gate-form" id="gate-form" autocomplete="off">
      <input class="gate-input" id="gate-input" type="password" placeholder="Password" autofocus>
      <button class="gate-btn" type="submit">Enter</button>
      <div class="gate-err" id="gate-err">Incorrect password. Try again.</div>
    </form>
  </div>
</div>

<div class="hdr">
  <div>
    <div class="hdr-title">Chess <span>Night</span></div>
  </div>
  <div class="hdr-meta" id="meta">Loading...</div>
</div>

<div id="app">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Fetching live data from Google Sheets...</p>
  </div>
</div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
const SHEET_ID = '10feTUuKW9BH-pHnp-A19I2UnVjDN3LIGthjlchm1K0A';
const CSV_URL  = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Sheet1`;

const PC = { // player colors
  John:'#e8d44d', Josh:'#4de8a8', Connor:'#e87a4d',
  Algor:'#a04de8', Conrad:'#4d9fe8', Mak:'#e84d9f',
  Mike:'#4de8e8', Russell:'#f0a050'
};
const pc = p => PC[p] || '#888888';

// ─── DATA ─────────────────────────────────────────────────────────────────────
let G = [], PLAYERS = [];
const charts = {};
const dc = id => { if(charts[id]){charts[id].destroy(); delete charts[id];} };

function parseCSVLine(line) {
  const out=[]; let cur='', inQ=false;
  for(let i=0;i<line.length;i++){
    if(line[i]==='"'){inQ=!inQ;}
    else if(line[i]===',' && !inQ){out.push(cur);cur='';}
    else cur+=line[i];
  }
  out.push(cur); return out;
}

function parseData(text) {
  const lines = text.trim().split('\n');
  const hdr = parseCSVLine(lines[0]).map(h=>h.trim());
  const games = [];
  for(let i=1;i<lines.length;i++){
    const v = parseCSVLine(lines[i]);
    if(v.length<6) continue;
    const r={};
    hdr.forEach((h,idx)=>r[h]=(v[idx]||'').trim());
    if(!r['Player 1']||!r['Player 2']||!r['Date']) continue;
    const d = new Date(r['Date']); if(isNaN(d)) continue;
    r._d = d;
    r._mo = d.toLocaleString('default',{month:'short',year:'2-digit'});
    r._moFull = d.toLocaleString('default',{month:'short',year:'numeric'});
    // notes analysis
    const notes = (r['Notes']||'').toLowerCase();
    const isDraw = notes.includes('draw') || r['Winner']===r['Loser'] || r['Winner']==='' || (r['Winner']===r['Player 1']&&r['Winner']===r['Player 2']);
    r._draw = isDraw;
    // winner/loser — use Winner col; handle game 256 type anomaly
    r._winner = isDraw ? null : (r['Winner']||'').trim();
    r._loser  = isDraw ? null : (r['Loser']||'').trim();
    r._diff   = parseInt(r['Point Differential'])||0;
    r._timed  = notes.includes('timed') || notes.includes('time out');
    games.push(r);
  }
  games.sort((a,b)=>a._d-b._d);
  return games;
}

function getPlayers(games) {
  const s=new Set();
  games.forEach(g=>{if(g['Player 1'])s.add(g['Player 1']);if(g['Player 2'])s.add(g['Player 2']);});
  return [...s].filter(p=>p&&p.length>1).sort();
}

// ─── ANALYTICS ────────────────────────────────────────────────────────────────
function pStats(player, games) {
  const pg = games.filter(g=>g['Player 1']===player||g['Player 2']===player);
  let w=0,l=0,d=0;
  pg.forEach(g=>{
    if(g._draw) d++;
    else if(g._winner===player) w++;
    else l++;
  });
  const t=w+l+d;
  return {w,l,d,t,pct:t?Math.round(w/t*100):0,pg};
}

function h2h(player, games) {
  const opp={};
  games.filter(g=>g['Player 1']===player||g['Player 2']===player).forEach(g=>{
    const o = g['Player 1']===player?g['Player 2']:g['Player 1'];
    if(!opp[o]) opp[o]={w:0,l:0,d:0};
    if(g._draw) opp[o].d++;
    else if(g._winner===player) opp[o].w++;
    else opp[o].l++;
  });
  return opp;
}

function cumPct(player, games) {
  const pg = games.filter(g=>g['Player 1']===player||g['Player 2']===player);
  let w=0,t=0;
  return pg.map(g=>{
    t++;
    if(!g._draw&&g._winner===player) w++;
    return {x:t, y:Math.round(w/t*100), d:g._d};
  });
}

function cumPctByDate(player, games) {
  const pg = games.filter(g=>g['Player 1']===player||g['Player 2']===player);
  let w=0,t=0;
  return pg.map(g=>{
    t++;
    if(!g._draw&&g._winner===player) w++;
    return {x:g._d.getTime(), y:Math.round(w/t*100), d:g._d};
  });
}

function byMonth(player, games) {
  const m={};
  games.filter(g=>g['Player 1']===player||g['Player 2']===player).forEach(g=>{
    if(!m[g._moFull]) m[g._moFull]={w:0,t:0};
    m[g._moFull].t++;
    if(!g._draw&&g._winner===player) m[g._moFull].w++;
  });
  return m;
}

function streak(player, games) {
  const pg = games.filter(g=>g['Player 1']===player||g['Player 2']===player).slice().reverse();
  let cur=0, type='';
  for(const g of pg){
    const res = g._draw?'d':g._winner===player?'w':'l';
    if(!type){type=res; cur=1;}
    else if(res===type) cur++;
    else break;
  }
  return {cur,type};
}

// ─── CHART DEFAULTS ───────────────────────────────────────────────────────────
Chart.defaults.color='#6b6b7a';
Chart.defaults.font.family="'DM Mono', monospace";
Chart.defaults.font.size=10;
const gridColor='rgba(255,255,255,0.04)';
const axisOpts=(label)=>({ticks:{color:'#6b6b7a'},grid:{color:gridColor},title:label?{display:true,text:label,color:'#6b6b7a',font:{size:10}}:{}});

// ─── BUILD ────────────────────────────────────────────────────────────────────
function boot(games) {
  G = games;
  PLAYERS = getPlayers(games);
  const sessions = [...new Set(games.map(g=>g['Date']))].length;
  document.getElementById('meta').innerHTML =
    `${games.length} games &nbsp;·&nbsp; ${sessions} sessions<br>`+
    `${games[0]._d.toLocaleDateString('en-US',{month:'short',year:'numeric'})} → ${games[games.length-1]._d.toLocaleDateString('en-US',{month:'short',year:'numeric'})} &nbsp;·&nbsp; Live`;

  document.getElementById('app').innerHTML = `
    <nav class="tabs">
      <button class="tab on" onclick="sw('overview',this)">Overview</button>
      <button class="tab" onclick="sw('player',this)">Player</button>
      <button class="tab" onclick="sw('h2h',this)">Head-to-Head</button>
      <button class="tab" onclick="sw('compare',this)">Compare</button>
      <button class="tab" onclick="sw('running',this)">Running Win%</button>
      <button class="tab" onclick="sw('games',this)">All Games</button>
    </nav>
    <div id="pane-overview" class="pane on"></div>
    <div id="pane-player"   class="pane"></div>
    <div id="pane-h2h"      class="pane"></div>
    <div id="pane-compare"  class="pane"></div>
    <div id="pane-running"  class="pane"></div>
    <div id="pane-games"    class="pane"></div>
  `;
  buildOverview();
  buildPlayer();
  buildH2H();
  buildCompare();
  buildRunning();
  buildGames();
}

function sw(id, btn) {
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  document.getElementById('pane-'+id).classList.add('on');
  btn.classList.add('on');
}

// ─── OVERVIEW ─────────────────────────────────────────────────────────────────
function buildOverview() {
  const el = document.getElementById('pane-overview');
  const draws = G.filter(g=>g._draw).length;
  const sessions = [...new Set(G.map(g=>g['Date']))].length;
  const biggestWin = G.filter(g=>!g._draw&&g._diff>0).sort((a,b)=>b._diff-a._diff)[0];

  // leaderboard — min 5 games
  const lb = PLAYERS.map(p=>({name:p,...pStats(p,G)}))
    .filter(p=>p.t>=5).sort((a,b)=>b.pct-a.pct||b.w-a.w);

  const rankClass = i => i===0?'gold':i===1?'silver':i===2?'bronze':'';

  const lbRows = lb.map((p,i)=>`
    <div class="lb-row">
      <div class="lb-rank ${rankClass(i)}">${i+1}</div>
      <div class="lb-name-wrap">
        <div class="name" style="color:${pc(p.name)}">${p.name}</div>
        <div class="lb-bar"><div class="lb-bar-fill" style="width:${p.pct}%;background:${pc(p.name)}"></div></div>
      </div>
      <div class="lb-num" style="color:#4de8a8">${p.w}</div>
      <div class="lb-num" style="color:#e84d6f">${p.l}</div>
      <div class="lb-num" style="color:#e8d44d">${p.d}</div>
      <div class="lb-num">${p.t}</div>
      <div class="lb-num" style="color:${pc(p.name)};font-weight:500">${p.pct}%</div>
    </div>`).join('');

  el.innerHTML = `
    <div class="stat-grid">
      <div class="stat"><div class="lbl">Total Games</div><div class="val" style="color:var(--accent)">${G.length}</div></div>
      <div class="stat"><div class="lbl">Sessions</div><div class="val">${sessions}</div></div>
      <div class="stat"><div class="lbl">Players</div><div class="val">${PLAYERS.length}</div></div>
      <div class="stat"><div class="lbl">Draws</div><div class="val" style="color:var(--accent)">${draws}</div><div class="sub">${Math.round(draws/G.length*100)}% of games</div></div>
      ${biggestWin?`<div class="stat"><div class="lbl">Biggest Margin</div><div class="val" style="color:var(--red);font-size:1.5rem">${biggestWin._diff} pts</div><div class="sub">${biggestWin._winner} beat ${biggestWin._loser}</div></div>`:''}
    </div>

    <div class="sec">Leaderboard</div>
    <div class="lb">
      <div class="lb-hdr"><div>#</div><div>Player</div><div style="text-align:right">W</div><div style="text-align:right">L</div><div style="text-align:right">D</div><div style="text-align:right">GP</div><div style="text-align:right">Win%</div></div>
      ${lbRows}
    </div>

    <div class="cgrid">
      <div class="cbox"><div class="sec" style="margin-top:0">Games per session</div><canvas id="c-sessions"></canvas></div>
      <div class="cbox"><div class="sec" style="margin-top:0">All-time wins</div><canvas id="c-wins"></canvas></div>
    </div>

    <div class="cbox"><div class="sec" style="margin-top:0">Win% by player (min 5 games)</div><canvas id="c-wpct"></canvas></div>
  `;

  // sessions bar
  const moMap={};
  G.forEach(g=>{if(!moMap[g._moFull])moMap[g._moFull]=0;moMap[g._moFull]++;});
  const mos=Object.keys(moMap);
  dc('sessions');
  charts['sessions']=new Chart(document.getElementById('c-sessions'),{
    type:'bar',
    data:{labels:mos,datasets:[{data:mos.map(m=>moMap[m]),backgroundColor:'rgba(232,212,77,0.65)',borderColor:'#e8d44d',borderWidth:1,borderRadius:3}]},
    options:{plugins:{legend:{display:false}},scales:{x:axisOpts(),y:axisOpts()},responsive:true,maintainAspectRatio:true}
  });

  // wins doughnut
  dc('wins');
  charts['wins']=new Chart(document.getElementById('c-wins'),{
    type:'doughnut',
    data:{labels:lb.map(p=>p.name),datasets:[{data:lb.map(p=>p.w),backgroundColor:lb.map(p=>pc(p.name)),borderColor:'#141418',borderWidth:2}]},
    options:{plugins:{legend:{position:'right',labels:{color:'#f0ede6',font:{family:'DM Mono',size:11},padding:12}}},responsive:true,maintainAspectRatio:true}

    options:{indexAxis:'y',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.parsed.x}% win rate (${lb[c.dataIndex].w}W / ${lb[c.dataIndex].l}L / ${lb[c.dataIndex].d}D)`}}},scales:{x:{...axisOpts(),min:0,max:100,ticks:{...axisOpts().ticks,callback:v=>v+'%'}},y:axisOpts()},responsive:true,maintainAspectRatio:true}
  });
}

// ─── PLAYER ───────────────────────────────────────────────────────────────────
function buildPlayer() {
  const el = document.getElementById('pane-player');
  const def = PLAYERS.includes('John')?'John':PLAYERS[0];
  el.innerHTML = `
    <div class="ctrls">
      <label>Player</label>
      <select id="sel-player" onchange="renderPlayer(this.value)">
        ${PLAYERS.map(p=>`<option ${p===def?'selected':''}>${p}</option>`).join('')}
      </select>
    </div>
    <div id="player-body"></div>
  `;
  renderPlayer(def);
}

function renderPlayer(p) {
  const s = pStats(p, G);
  const opp = h2h(p, G);
  const sr = streak(p, G);
  const col = pc(p);
  const strLabel = sr.type==='w'?'Win':sr.type==='l'?'Loss':'Draw';
  const strColor = sr.type==='w'?'var(--green)':sr.type==='l'?'var(--red)':'var(--accent)';

  const beaten = Object.entries(opp).sort((a,b)=>b[1].w-a[1].w);
  const hardest = Object.entries(opp).sort((a,b)=>b[1].l-a[1].l);

  const cards = Object.entries(opp).map(([o,r])=>{
    const t=r.w+r.l+r.d, pct=t?Math.round(r.w/t*100):0;
    return `<div class="h2h-card">
      <div class="h2h-opp" style="color:${pc(o)}">${o}</div>
      <div class="h2h-pct" style="color:${pct>=50?'var(--green)':'var(--red)'}">${pct}%</div>
      <div class="h2h-bar"><div class="h2h-bar-fill" style="width:${pct}%;background:${pct>=50?'var(--green)':'var(--red)'}"></div></div>
      <div class="h2h-nums">
        <span style="color:var(--green)">${r.w}W</span>
        <span style="color:var(--accent)">${r.d}D</span>
        <span style="color:var(--red)">${r.l}L</span>
        <span>${t} games</span>
      </div>
    </div>`;
  }).join('');

  document.getElementById('player-body').innerHTML = `
    <div class="stat-grid">
      <div class="stat"><div class="lbl">Win %</div><div class="val" style="color:${col}">${s.pct}%</div></div>
      <div class="stat"><div class="lbl">Wins</div><div class="val" style="color:var(--green)">${s.w}</div></div>
      <div class="stat"><div class="lbl">Losses</div><div class="val" style="color:var(--red)">${s.l}</div></div>
      <div class="stat"><div class="lbl">Draws</div><div class="val" style="color:var(--accent)">${s.d}</div></div>
      <div class="stat"><div class="lbl">Games</div><div class="val">${s.t}</div></div>
      <div class="stat"><div class="lbl">Current Streak</div><div class="val" style="color:${strColor};font-size:1.3rem;padding-top:.2rem">${sr.cur} ${strLabel}${sr.cur!==1?'s':''}</div></div>
      ${beaten[0]?`<div class="stat"><div class="lbl">Most Beaten</div><div class="val" style="color:${pc(beaten[0][0])};font-size:1.2rem;padding-top:.25rem">${beaten[0][0]}</div><div class="sub">${beaten[0][1].w} wins</div></div>`:''}
      ${hardest[0]?`<div class="stat"><div class="lbl">Hardest Opp</div><div class="val" style="color:${pc(hardest[0][0])};font-size:1.2rem;padding-top:.25rem">${hardest[0][0]}</div><div class="sub">${hardest[0][1].l} losses</div></div>`:''}
    </div>

    <div class="sec">Win % by month</div>
    <div class="cbox"><canvas id="c-p-monthly"></canvas></div>

    <div class="sec">Record vs each opponent</div>
    <div class="h2h-grid">${cards}</div>
  `;

  // monthly chart
  const bm = byMonth(p, G);
  const mls = Object.keys(bm);
  const mpcts = mls.map(m=>bm[m].t?Math.round(bm[m].w/bm[m].t*100):0);
  dc('p-monthly');
  charts['p-monthly'] = new Chart(document.getElementById('c-p-monthly'),{
    type:'bar',
    data:{labels:mls,datasets:[{label:'Win %',data:mpcts,backgroundColor:mpcts.map(v=>col+(v>=50?'cc':'44')),borderColor:col,borderWidth:1,borderRadius:3}]},
    options:{
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.parsed.y}% (${bm[mls[c.dataIndex]].w}W / ${bm[mls[c.dataIndex]].t} games)`}}},
      scales:{x:axisOpts(),y:{...axisOpts(),min:0,max:100,ticks:{color:'#6b6b7a',callback:v=>v+'%'}}},
      responsive:true,maintainAspectRatio:true
    }
  });
}

// ─── HEAD-TO-HEAD ─────────────────────────────────────────────────────────────
function buildH2H() {
  const el = document.getElementById('pane-h2h');
  const p1 = PLAYERS.includes('John')?'John':PLAYERS[0];
  const p2 = PLAYERS.includes('Josh')?'Josh':PLAYERS[1];
  el.innerHTML = `
    <div class="ctrls">
      <label>Player 1</label>
      <select id="h2h-p1" onchange="renderH2H()">
        ${PLAYERS.map(p=>`<option ${p===p1?'selected':''}>${p}</option>`).join('')}
      </select>
      <label>vs</label>
      <select id="h2h-p2" onchange="renderH2H()">
        ${PLAYERS.map(p=>`<option ${p===p2?'selected':''}>${p}</option>`).join('')}
      </select>
    </div>
    <div id="h2h-body"></div>
  `;
  renderH2H();
}

let h2hPage=1; const h2hPer=20; let h2hGames=[];
function renderH2H() {
  const p1=document.getElementById('h2h-p1').value;
  const p2=document.getElementById('h2h-p2').value;
  const el=document.getElementById('h2h-body');
  if(p1===p2){el.innerHTML='<p style="color:var(--muted);font-family:DM Mono,monospace;font-size:12px;padding:1rem">Pick two different players.</p>';return;}

  h2hGames = G.filter(g=>(g['Player 1']===p1&&g['Player 2']===p2)||(g['Player 1']===p2&&g['Player 2']===p1)).slice().reverse();
  let p1w=0,p2w=0,dr=0;
  h2hGames.forEach(g=>{
    if(g._draw) dr++;
    else if(g._winner===p1) p1w++;
    else p2w++;
  });
  const tot=h2hGames.length;
  const p1pct=tot?Math.round(p1w/tot*100):0;
  const p2pct=tot?Math.round(p2w/tot*100):0;

  h2hPage=1;
  el.innerHTML = `
    <div class="stat-grid" style="max-width:600px">
      <div class="stat"><div class="lbl">${p1} wins</div><div class="val" style="color:${pc(p1)}">${p1w}</div><div class="sub">${p1pct}%</div></div>
      <div class="stat"><div class="lbl">Draws</div><div class="val" style="color:var(--accent)">${dr}</div></div>
      <div class="stat"><div class="lbl">${p2} wins</div><div class="val" style="color:${pc(p2)}">${p2w}</div><div class="sub">${p2pct}%</div></div>
      <div class="stat"><div class="lbl">Total</div><div class="val">${tot}</div></div>
    </div>
    <div class="sec">${p1} vs ${p2} — game log</div>
    <div id="h2h-tbl"></div>
  `;
  renderH2HTable(p1,p2);
}

function renderH2HTable(p1,p2) {
  const slice=h2hGames.slice((h2hPage-1)*h2hPer, h2hPage*h2hPer);
  const total=Math.ceil(h2hGames.length/h2hPer);
  const rows=slice.map(g=>`<tr>
    <td style="color:var(--muted)">${g['Game ID']}</td>
    <td>${g._d.toLocaleDateString()}</td>
    <td style="color:${pc(g['Player 1'])}">${g['Player 1']}</td>
    <td style="color:var(--muted);font-size:10px">${g['Color 1']}</td>
    <td style="color:${pc(g['Player 2'])}">${g['Player 2']}</td>
    <td style="color:var(--muted);font-size:10px">${g['Color 2']}</td>
    <td><span class="bdg ${g._draw?'bdg-d':g._winner===p1?'bdg-w':'bdg-l'}">${g._draw?'Draw':g._winner}</span></td>
    <td style="text-align:right;color:${Math.abs(g._diff)>10?'var(--red)':'var(--muted)'}">${g._diff||'—'}</td>
    <td style="color:var(--muted);font-size:11px">${g['Notes']||''}</td>
  </tr>`).join('');

  const pgs=buildPages(h2hPage,total,'h2hPage','renderH2HTable(\''+p1+'\',\''+p2+'\')');
  document.getElementById('h2h-tbl').innerHTML=`
    <div class="tbl-wrap">
      <table><thead><tr><th>#</th><th>Date</th><th>P1</th><th>Color</th><th>P2</th><th>Color</th><th>Result</th><th>Margin</th><th>Notes</th></tr></thead>
      <tbody>${rows}</tbody></table>
    </div>
    <div class="pages"><span>${h2hGames.length} games</span>${pgs}</div>
  `;
}

// ─── COMPARE ──────────────────────────────────────────────────────────────────
function buildCompare() {
  const el = document.getElementById('pane-compare');
  const p1def = PLAYERS.includes('John')?'John':PLAYERS[0];
  const p2def = PLAYERS.includes('Josh')?'Josh':(PLAYERS[1]||'');

  const noteSet = new Set();
  G.forEach(g=>{
    const n=(g['Notes']||'').trim();
    noteSet.add(n===''?'No note':n);
  });
  const notes=[...noteSet].sort((a,b)=> a==='No note'?-1 : b==='No note'?1 : a.localeCompare(b));

  const minDate = G[0]._d.toISOString().slice(0,10);
  const maxDate = G[G.length-1]._d.toISOString().slice(0,10);
  window._cmpMin = minDate;
  window._cmpMax = maxDate;

  el.innerHTML = `
    <div class="ctrls">
      <label>Player 1</label>
      <select id="cmp-p1" onchange="renderCompare()">
        ${PLAYERS.map(p=>`<option ${p===p1def?'selected':''}>${p}</option>`).join('')}
      </select>
      <label>Player 2</label>
      <select id="cmp-p2" onchange="renderCompare()">
        <option value="">All opponents</option>
        ${PLAYERS.map(p=>`<option ${p===p2def?'selected':''}>${p}</option>`).join('')}
      </select>
    </div>
    <div class="ctrls">
      <label>From</label>
      <input type="date" id="cmp-start" value="${minDate}" min="${minDate}" max="${maxDate}" onchange="renderCompare()">
      <label>To</label>
      <input type="date" id="cmp-end" value="${maxDate}" min="${minDate}" max="${maxDate}" onchange="renderCompare()">
      <div class="pill" onclick="cmpQuickRange('all')">All time</div>
      <div class="pill" onclick="cmpQuickRange('year')">This year</div>
      <div class="pill" onclick="cmpQuickRange('6mo')">Last 6 months</div>
      <div class="pill" onclick="cmpQuickRange('3mo')">Last 3 months</div>
    </div>
    <div class="ctrls">
      <label>Note</label>
      <select id="cmp-note" onchange="renderCompare()">
        <option value="">All</option>
        ${notes.map(n=>`<option>${n}</option>`).join('')}
      </select>
      <div class="pill" onclick="clearCompare()" style="margin-left:auto;color:var(--accent);border-color:var(--accent)">Clear filters</div>
    </div>
    <div id="compare-body"></div>
  `;
  renderCompare();
}

function cmpQuickRange(type) {
  const max = new Date(window._cmpMax);
  let start;
  if(type==='all') start = new Date(window._cmpMin);
  else if(type==='year') start = new Date(max.getFullYear(),0,1);
  else if(type==='6mo'){ start=new Date(max); start.setMonth(start.getMonth()-6); }
  else if(type==='3mo'){ start=new Date(max); start.setMonth(start.getMonth()-3); }
  let startStr = start.toISOString().slice(0,10);
  if(startStr < window._cmpMin) startStr = window._cmpMin;
  document.getElementById('cmp-start').value = startStr;
  document.getElementById('cmp-end').value = window._cmpMax;
  renderCompare();
}

function clearCompare() {
  const p1def = PLAYERS.includes('John')?'John':PLAYERS[0];
  document.getElementById('cmp-p1').value = p1def;
  document.getElementById('cmp-p2').value = '';
  document.getElementById('cmp-start').value = window._cmpMin;
  document.getElementById('cmp-end').value = window._cmpMax;
  document.getElementById('cmp-note').value = '';
  renderCompare();
}

let cmpPage=1; const cmpPer=20; let cmpGames=[];
function renderCompare() {
  const p1 = document.getElementById('cmp-p1').value;
  const p2 = document.getElementById('cmp-p2').value;
  const startStr = document.getElementById('cmp-start').value;
  const endStr = document.getElementById('cmp-end').value;
  const note = document.getElementById('cmp-note').value;
  const start = startStr ? new Date(startStr) : null;
  const end = endStr ? new Date(endStr) : null;
  if(end) end.setHours(23,59,59,999);

  const filtered = G.filter(g=>{
    if(g['Player 1']!==p1 && g['Player 2']!==p1) return false;
    if(p2 && g['Player 1']!==p2 && g['Player 2']!==p2) return false;
    if(start && g._d < start) return false;
    if(end && g._d > end) return false;
    if(note){
      const n=(g['Notes']||'').trim();
      if((n===''?'No note':n)!==note) return false;
    }
    return true;
  });

  let w=0,l=0,d=0;
  filtered.forEach(g=>{
    if(g._draw) d++;
    else if(g._winner===p1) w++;
    else l++;
  });
  const t=w+l+d, pct=t?Math.round(w/t*100):0;
  const col=pc(p1);

  cmpPage=1;
  cmpGames = filtered.slice().reverse();

  document.getElementById('compare-body').innerHTML = `
    <div class="stat-grid" style="max-width:600px">
      <div class="stat"><div class="lbl">${p1} Win %</div><div class="val" style="color:${col}">${pct}%</div></div>
      <div class="stat"><div class="lbl">Wins</div><div class="val" style="color:var(--green)">${w}</div></div>
      <div class="stat"><div class="lbl">Losses</div><div class="val" style="color:var(--red)">${l}</div></div>
      <div class="stat"><div class="lbl">Draws</div><div class="val" style="color:var(--accent)">${d}</div></div>
      <div class="stat"><div class="lbl">Games</div><div class="val">${t}</div></div>
    </div>

    <div class="sec">Win % by month</div>
    <div class="cbox"><canvas id="c-cmp-monthly"></canvas></div>

    <div class="sec">Game log</div>
    <div id="cmp-tbl"></div>
  `;

  const bm={};
  filtered.forEach(g=>{
    if(!bm[g._moFull]) bm[g._moFull]={w:0,t:0};
    bm[g._moFull].t++;
    if(!g._draw&&g._winner===p1) bm[g._moFull].w++;
  });
  const mls=Object.keys(bm);
  const mpcts=mls.map(m=>bm[m].t?Math.round(bm[m].w/bm[m].t*100):0);
  dc('cmp-monthly');
  charts['cmp-monthly']=new Chart(document.getElementById('c-cmp-monthly'),{
    type:'bar',
    data:{labels:mls,datasets:[{label:'Win %',data:mpcts,backgroundColor:mpcts.map(v=>col+(v>=50?'cc':'44')),borderColor:col,borderWidth:1,borderRadius:3}]},
    options:{
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.parsed.y}% (${bm[mls[c.dataIndex]].w}W / ${bm[mls[c.dataIndex]].t} games)`}}},
      scales:{x:axisOpts(),y:{...axisOpts(),min:0,max:100,ticks:{color:'#6b6b7a',callback:v=>v+'%'}}},
      responsive:true,maintainAspectRatio:true
    }
  });

  renderCompareTable(p1);
}

function renderCompareTable(p1) {
  const slice=cmpGames.slice((cmpPage-1)*cmpPer, cmpPage*cmpPer);
  const total=Math.ceil(cmpGames.length/cmpPer);
  const rows=slice.map(g=>`<tr>
    <td style="color:var(--muted)">${g['Game ID']}</td>
    <td>${g._d.toLocaleDateString()}</td>
    <td style="color:${pc(g['Player 1'])}">${g['Player 1']}</td>
    <td style="color:${pc(g['Player 2'])}">${g['Player 2']}</td>
    <td><span class="bdg ${g._draw?'bdg-d':'bdg-w'}" style="${g._draw?'':'background:'+pc(g._winner||'')+'18;color:'+pc(g._winner||'')}">${g._draw?'Draw':g._winner}</span></td>
    <td style="text-align:right;color:${Math.abs(g._diff)>10?'var(--red)':'var(--muted)'}">${g._diff||'—'}</td>
    <td style="color:var(--muted);font-size:11px;max-width:200px;overflow:hidden;text-overflow:ellipsis">${g['Notes']||''}</td>
  </tr>`).join('');

  const pgs=buildPages(cmpPage,total,'cmpPage','renderCompareTable(\''+p1+'\')');
  document.getElementById('cmp-tbl').innerHTML=`
    <div class="tbl-wrap">
      <table><thead><tr><th>#</th><th>Date</th><th>Player 1</th><th>Player 2</th><th>Winner</th><th>Margin</th><th>Notes</th></tr></thead>
      <tbody>${rows}</tbody></table>
    </div>
    <div class="pages"><span>${cmpGames.length} games</span>${pgs}</div>
  `;
}

// ─── RUNNING WIN% ─────────────────────────────────────────────────────────────
function buildRunning() {
  const el = document.getElementById('pane-running');
  const main = PLAYERS.filter(p=>pStats(p,G).t>=5);
  window._runActive = new Set(main);
  window._runMode = 'game';
  el.innerHTML = `
    <div class="sec" style="margin-top:0">Cumulative win% — every game counts</div>
    <p style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:1rem">
      Game 1 win = 100%. Game 2 loss = 50%. Game 3 win = 66%. Each dot is one game played.
    </p>
    <div class="ctrls">
      <label>X-axis</label>
      <div style="display:flex;gap:6px" id="run-mode-pills">
        <div class="pill on" data-mode="game" style="background:var(--accent);color:#0d0d0f;border-color:var(--accent)" onclick="setRunMode('game',this)">By Game #</div>
        <div class="pill" data-mode="date" onclick="setRunMode('date',this)">By Date</div>
      </div>
    </div>
    <div class="ctrls">
      <label>Toggle players</label>
      <div style="display:flex;flex-wrap:wrap;gap:6px" id="run-pills">
        ${main.map(p=>`<div class="pill on" style="background:${pc(p)};color:#0d0d0f;border-color:${pc(p)}" data-p="${p}" onclick="toggleRun('${p}',this)">${p}</div>`).join('')}
      </div>
    </div>
    <div class="cbox" style="height:360px"><canvas id="c-running"></canvas></div>
  `;
  renderRunning();
}

function toggleRun(p, el) {
  if(window._runActive.has(p)){window._runActive.delete(p);el.classList.remove('on');el.style.background='';el.style.color='';el.style.borderColor='';}
  else{window._runActive.add(p);el.classList.add('on');el.style.background=pc(p);el.style.color='#0d0d0f';el.style.borderColor=pc(p);}
  renderRunning();
}

function setRunMode(mode, el) {
  if(window._runMode===mode) return;
  window._runMode=mode;
  document.querySelectorAll('#run-mode-pills .pill').forEach(p=>{
    p.classList.remove('on');
    p.style.background=''; p.style.color=''; p.style.borderColor='';
  });
  el.classList.add('on');
  el.style.background='var(--accent)';
  el.style.color='#0d0d0f';
  el.style.borderColor='var(--accent)';
  renderRunning();
}

function renderRunning() {
  const players=[...window._runActive];
  const mode = window._runMode||'game';
  const ds=players.map(p=>({
    label:p,
    data: mode==='date' ? cumPctByDate(p,G) : cumPct(p,G),
    borderColor:pc(p),
    backgroundColor:'transparent',
    tension:0.25,
    pointRadius:0,
    pointHoverRadius:5,
    borderWidth:2.5
  }));
  dc('running');

  const xScale = mode==='date'
    ? {type:'linear',grid:{color:gridColor},
       title:{display:true,text:'Date',color:'#6b6b7a',font:{size:10}},
       ticks:{color:'#6b6b7a',callback:v=>new Date(v).toLocaleDateString('en-US',{month:'short',year:'2-digit'})}}
    : {type:'linear',...axisOpts('Game #')};

  charts['running']=new Chart(document.getElementById('c-running'),{
    type:'line',data:{datasets:ds},
    options:{
      parsing:false,
      plugins:{
        legend:{labels:{color:'#f0ede6',font:{family:'DM Mono',size:11},padding:14}},
        tooltip: mode==='date' ? {callbacks:{title:items=>items.length?new Date(items[0].parsed.x).toLocaleDateString():''}} : {}
      },
      scales:{
        x:xScale,
        y:{min:0,max:100,...axisOpts('Win %'),ticks:{color:'#6b6b7a',callback:v=>v+'%'}}
      },
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false}
    }
  });
  document.getElementById('c-running').parentElement.style.height='360px';
}

    <div class="ctrls">

function filterG() {
  const pl=document.getElementById('gp').value;
  const res=document.getElementById('gr').value;
  const col=document.getElementById('gc').value;
  const srch=document.getElementById('gs').value.toLowerCase();
  gFiltered=[...G].reverse().filter(g=>{
    if(pl){
      if(g['Player 1']!==pl&&g['Player 2']!==pl) return false;
      if(res==='win'&&(g._draw||g._winner!==pl)) return false;
      if(res==='loss'&&(g._draw||g._loser!==pl)) return false;
      if(col){
        const gc2=(g['Player 1']===pl?g['Color 1']:g['Color 2']);
        if(gc2!==col) return false;
      }
    } else {
      if(res==='draw'&&!g._draw) return false;
    }
    if(srch&&!(g['Player 1'].toLowerCase().includes(srch)||g['Player 2'].toLowerCase().includes(srch)||(g['Notes']||'').toLowerCase().includes(srch)||(g['Winner']||'').toLowerCase().includes(srch))) return false;
    return true;
  });
  gPage=1; renderGames();
}

function renderGames() {
  const slice=gFiltered.slice((gPage-1)*gPer,gPage*gPer);
  const total=Math.ceil(gFiltered.length/gPer);
  const rows=slice.map(g=>`<tr>
    <td style="color:var(--muted)">${g['Game ID']}</td>
    <td>${g._d.toLocaleDateString()}</td>
    <td style="color:${pc(g['Player 1'])}">${g['Player 1']}</td>
    <td style="color:var(--muted);font-size:10px">${g['Color 1']}</td>
    <td style="color:${pc(g['Player 2'])}">${g['Player 2']}</td>
    <td style="color:var(--muted);font-size:10px">${g['Color 2']}</td>
    <td><span class="bdg ${g._draw?'bdg-d':'bdg-w'}" style="${g._draw?'':'background:'+pc(g._winner||'')+'18;color:'+pc(g._winner||'')}">${g._draw?'Draw':g._winner}</span></td>
    <td style="text-align:right;color:${Math.abs(g._diff)>15?'var(--red)':Math.abs(g._diff)>8?'var(--accent)':'var(--muted)'}">${g._diff||'—'}</td>
    <td style="color:var(--muted);font-size:11px;max-width:160px;overflow:hidden;text-overflow:ellipsis">${g['Notes']||''}</td>
  </tr>`).join('');
  const pgs=buildPages(gPage,total,'gPage','renderGames()');
  document.getElementById('g-tbl').innerHTML=`
    <div class="tbl-wrap">
      <table><thead><tr><th>#</th><th>Date</th><th>Player 1</th><th>Color</th><th>Player 2</th><th>Color</th><th>Winner</th><th>Margin</th><th>Notes</th></tr></thead>
      <tbody>${rows}</tbody></table>
    </div>
    <div class="pages"><span>${gFiltered.length} games</span>${pgs}</div>
  `;
}

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function buildPages(cur, total, varName, fn) {
  if(total<=1) return '';
  let html='';
  for(let i=1;i<=total;i++){
    if(i===1||i===total||Math.abs(i-cur)<=1){
      html+=`<button class="pg ${i===cur?'on':''}" onclick="${varName}=${i};${fn}">${i}</button>`;
    } else if(Math.abs(i-cur)===2){
      html+='<span style="color:var(--muted)">…</span>';
    }
  }
  return html;
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
async function startApp() {
  try {
    const res = await fetch(CSV_URL);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const text = await res.text();
    const games = parseData(text);
    if(!games.length) throw new Error('No games parsed');
    boot(games);
  } catch(e) {
    document.getElementById('app').innerHTML=`<div class="err">
      Could not load data from Google Sheets.<br><br>
      Make sure the sheet is shared: Share → Anyone with the link → Viewer<br><br>
      Error: ${e.message}<br>
      Sheet ID: ${SHEET_ID}
    </div>`;
    document.getElementById('meta').textContent='Error loading data';
  }
}

// ─── PASSWORD GATE ────────────────────────────────────────────────────────────
const GATE_PASSWORD = 'neighneigh';
const GATE_KEY = 'chessNightAuthed';

function unlockGate() {
  document.getElementById('gate').remove();
  startApp();
}

(() => {
  const gate = document.getElementById('gate');
  if(sessionStorage.getItem(GATE_KEY)==='1'){ gate.remove(); startApp(); return; }

  const form = document.getElementById('gate-form');
  const input = document.getElementById('gate-input');
  const err = document.getElementById('gate-err');

  form.addEventListener('submit', e => {
    e.preventDefault();
    if(input.value === GATE_PASSWORD){
      sessionStorage.setItem(GATE_KEY, '1');
      unlockGate();
    } else {
      err.classList.add('show');
      input.classList.remove('shake');
      void input.offsetWidth; // restart animation
      input.classList.add('shake');
      input.value = '';
      input.focus();
    }
  });
})();
</script>
